<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TIRABOSCHI — L'Atelier</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   TIRABOSCHI — L'Atelier
   Trois principes :
   1. Aucun scroll de page. Chaque moment tient dans l'écran, entier.
   2. Un parcours libre : silhouette → atelier → certificat, et retour
      à tout moment par le fil d'étapes.
   3. Un choix = une plongée plein écran dans la matière.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --noir:#0a0a0a;--blanc:#fff;--ecru:#efeae3;
  --e:cubic-bezier(.16,1,.3,1);
  --amb:#0a0a0a;--txt:#fff;
}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Playfair Display',Georgia,serif;background:var(--amb);color:var(--txt);
  transition:background 1.3s var(--e);-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block;width:100%;height:100%;object-fit:cover}

/* ═══ Scènes ═══ */
.sc{position:fixed;inset:0;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .9s var(--e),visibility .9s}
.sc.on{opacity:1;visibility:visible;pointer-events:auto}

/* ── Cadre commun ── */
.hud{position:fixed;inset:0;z-index:60;pointer-events:none}
.hud>*{pointer-events:auto}
.hud__mark{position:absolute;top:30px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.42em;text-transform:uppercase;opacity:.7;
  transition:letter-spacing 1.1s var(--e),opacity .6s}
.hud__mark.br{letter-spacing:.62em;opacity:.35}
/* Le fil d'étapes : on circule librement entre les trois moments. */
.hud__pas{position:absolute;top:29px;left:clamp(18px,3vw,40px);
  display:flex;align-items:center;gap:12px}
.pa{font-size:9px;letter-spacing:.22em;text-transform:uppercase;opacity:.34;
  padding-bottom:5px;position:relative;transition:opacity .35s}
.pa::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:1px;
  background:currentColor;transform:scaleX(0);transform-origin:left;
  transition:transform .5s var(--e)}
.pa.on{opacity:1}.pa.on::after{transform:scaleX(1)}
.pa:not(:disabled):hover{opacity:.85}
.pa:disabled{opacity:.13;cursor:default}
.hud__sep{font-size:9px;opacity:.2}
@media(max-width:760px){
  /* sous la marque, centré : à gauche il entrait en collision avec elle */
  .hud__pas{left:0;right:0;top:56px;justify-content:center;gap:10px}
  .pa{letter-spacing:.16em}
  .pa i{display:none}
}

/* ═══ 1 · LES BRIQUES — les silhouettes se feuillettent à la main ═══
   Un mur de plaques photographiques que l'on fait glisser, comme on
   feuillette des ardoises dans un tiroir d'atelier. */
.dk{position:absolute;left:0;right:0;top:clamp(70px,10svh,92px);bottom:clamp(216px,31svh,290px);
  touch-action:pan-y;cursor:grab}
.dk.tire{cursor:grabbing}
.bk{position:absolute;top:50%;left:50%;
  width:min(52vw,440px,calc((100svh - 70px - clamp(216px,31svh,290px))*.72));
  aspect-ratio:3/4;
  background:#fff;overflow:hidden;
  transform:translate(-50%,-50%);opacity:0;visibility:hidden;
  box-shadow:0 34px 90px rgba(0,0,0,.55);
  transition:transform .85s var(--e),opacity .6s var(--e),filter .6s}
.dk.tire .bk{transition:none}
.bk img{object-fit:contain;padding:7% 7% 13%}
.bk__n{position:absolute;left:0;right:0;bottom:13px;text-align:center;
  color:#0a0a0a;font-size:9px;letter-spacing:.3em;text-transform:uppercase;opacity:.5;
  transition:opacity .5s}
.bk.mid .bk__n{opacity:0}
.bk::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.10),transparent 40%);
  opacity:0;transition:opacity .6s}
.bk.mid::after{opacity:1}
.bk.nofile img{opacity:0}
.bk.nofile::before{content:'Packshot attendu';position:absolute;top:50%;left:0;right:0;
  transform:translateY(-50%);text-align:center;color:rgba(10,10,10,.3);
  font-size:9px;letter-spacing:.22em;text-transform:uppercase}

.dk__inf{position:absolute;left:0;right:0;bottom:clamp(52px,9svh,86px);
  text-align:center;padding:0 18px;pointer-events:none}
.dk__inf>*{pointer-events:auto}
.dk__t{font-size:9px;letter-spacing:.3em;text-transform:uppercase;opacity:.45;
  margin-bottom:10px}
.dk__n{font-size:clamp(34px,5.4vw,62px);letter-spacing:-.03em;line-height:1;
  font-style:italic;margin-bottom:10px}
.dk__p{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.4;
  margin-bottom:18px}
.dk__inf p.lig,.dk__inf h1.lig{display:block}
.dk__inf .btn.lig{display:inline-flex}
.btn{display:inline-flex;align-items:center;gap:14px;
  border:1px solid rgba(255,255,255,.45);padding:15px 32px;
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  transition:background .35s,border-color .35s,gap .45s var(--e)}
.btn:hover{background:rgba(255,255,255,.1);border-color:#fff;gap:22px}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.3}
.lig{opacity:0;transform:translateY(18px);
  transition:opacity .8s var(--e),transform 1s var(--e)}
.lig.in{opacity:1;transform:none}
.dk__n.lig.in{opacity:1}
.sil__nav{position:absolute;bottom:clamp(18px,3.6svh,36px);left:50%;transform:translateX(-50%);
  z-index:6;display:flex;gap:18px;align-items:center}
.dot{width:30px;height:1px;background:#fff;opacity:.2;transition:opacity .5s,transform .5s var(--e)}
.dot.on{opacity:.95;transform:scaleY(2.4)}
.arw{position:absolute;top:50%;transform:translateY(-50%);z-index:7;
  width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  opacity:.35;transition:opacity .3s,transform .4s var(--e)}
.arw:hover{opacity:1}
.arw--p{left:clamp(6px,1.6vw,22px)}.arw--n{right:clamp(6px,1.6vw,22px)}
.arw svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1}
@media(max-width:760px){.arw{display:none}}

/* ═══ 2 · L'ATELIER — la pièce en plein cadre ═══ */
/* La scène se partage : la pièce en majesté, la fiche d'atelier à droite —
   chaque ligne est une étape, comme un configurateur de haute horlogerie. */
.atl__grid{position:absolute;inset:0;display:grid;
  grid-template-columns:1fr clamp(340px,32vw,460px)}
.atl__scene{position:relative}
.atl__ph{position:absolute;inset:0;background:#fff;isolation:isolate}
.atl__ph img{object-fit:contain;transition:transform 5s var(--e),filter 1.1s var(--e)}
.atl.zoom .atl__ph img{transform:scale(1.14)}
/* La teinte et le grain se posent SUR la photo.
   « color » et « overlay » conservent le blanc pur : le fond studio reste blanc,
   seule la pièce prend le cuir. C'est ce qui fait qu'un choix se voit. */
.atl__teint{position:absolute;inset:0;mix-blend-mode:color;opacity:0;pointer-events:none;
  transition:opacity 1.1s var(--e),background-color 1.1s var(--e)}
.atl__grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:0;pointer-events:none;
  background-size:512px 512px;transition:opacity 1.1s var(--e)}
.atl__ph.nofile::before{content:'Photographie indisponible hors connexion';
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(10,10,10,.28)}
.atl__ph.nofile img{opacity:0}
.atl__ph::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(10,10,10,.20) 92%)}
/* Le voile qui balaie la pièce quand la matière change */
.atl__mue{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3;
  background:linear-gradient(100deg,transparent 34%,rgba(255,255,255,.85) 50%,transparent 66%);
  background-size:280% 100%}
.atl__ph.mue .atl__mue{animation:balai 1.15s var(--e)}
@keyframes balai{0%{opacity:0;background-position:120% 0}
  22%{opacity:1}80%{opacity:1}100%{opacity:0;background-position:-60% 0}}

/* Repères posés sur la photo, dans la bande réellement visible sous le HUD. */
.reps{position:absolute;left:0;right:0;top:64px;bottom:16px;z-index:8;
  pointer-events:none}
@media(max-width:760px){.reps{top:84px}}
.reps .rep{pointer-events:auto}
.rep{position:absolute;z-index:8;display:flex;align-items:center;gap:0;
  transform:translate(-50%,-50%)}
.rep__o{position:relative;width:26px;height:26px;border:1px solid rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .35s,border-color .35s,transform .45s var(--e)}
.rep__o::after{content:'';width:4px;height:4px;background:#fff;opacity:.8;
  transition:opacity .35s}
.rep.set .rep__o::after{opacity:0}
/* La pastille prend le cuir (ou le métal) retenu : le repère devient la preuve. */
.rep__sw{position:absolute;inset:2px;opacity:0;transform:scale(.5);
  background-repeat:repeat;background-size:150px 150px;background-blend-mode:hard-light;
  transition:opacity .5s var(--e),transform .6s var(--e)}
.rep.set .rep__sw{opacity:1;transform:none}
.rep:hover .rep__o{background:rgba(255,255,255,.16);border-color:#fff;transform:scale(1.18)}
.rep.set .rep__o{background:#fff}
.rep.set .rep__o::after{background:var(--noir);opacity:1}
.rep__l{white-space:nowrap;overflow:hidden;max-width:0;opacity:0;
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  transition:max-width .55s var(--e),opacity .4s,padding .55s var(--e),margin .55s var(--e)}
/* La pièce peut être noire comme craie : l'étiquette porte son propre fond. */
body.clair .rep__l{background:rgba(255,255,255,.94);color:#0a0a0a;
  box-shadow:0 1px 14px rgba(10,10,10,.12)}
body.clair .rep:hover .rep__l,body.clair .rep.set .rep__l{padding:7px 12px;margin-left:11px}
.rep:hover .rep__l{max-width:260px;opacity:1;padding-left:13px}
.rep.set .rep__l{max-width:260px;opacity:.78;padding-left:13px}
.rep.set:hover .rep__l{opacity:1}
.rep__v{font-style:italic;text-transform:none;letter-spacing:.02em;font-size:11px;opacity:.85}
.rep__pulse{position:absolute;left:13px;top:13px;width:26px;height:26px;
  transform:translate(-50%,-50%);border:1px solid #fff;opacity:0;pointer-events:none}
.rep:not(.set) .rep__pulse{animation:onde 3.4s var(--e) infinite}
@keyframes onde{0%{opacity:.5;transform:translate(-50%,-50%) scale(1)}
  70%{opacity:0;transform:translate(-50%,-50%) scale(2.5)}100%{opacity:0}}

/* La fiche d'atelier — colonne de droite, style grande maison horlogère */
.fiche{position:relative;z-index:20;display:flex;flex-direction:column;
  padding:76px clamp(18px,2.6vw,40px) clamp(14px,2.6svh,26px);
  border-left:1px solid rgba(10,10,10,.10)}
.fiche__k{font-size:9px;letter-spacing:.3em;text-transform:uppercase;opacity:.45;
  margin-bottom:10px;flex-shrink:0}
.fiche__l{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 34px),transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 34px),transparent 100%);
  padding-bottom:36px}
.fiche__l::-webkit-scrollbar{display:none}
.aj{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:12px 2px;border-bottom:1px solid rgba(10,10,10,.12);
  transition:padding-left .4s var(--e),background .3s}
.aj:hover{padding-left:10px;background:rgba(10,10,10,.03)}
.aj__i{font-size:9px;letter-spacing:.1em;opacity:.3;width:20px;flex-shrink:0}
.aj__x{flex:1;min-width:0}
.aj__n{font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.5;display:block}
.aj__v{font-size:13px;font-style:italic;margin-top:4px;display:flex;align-items:center;
  gap:8px;opacity:.55;white-space:nowrap;overflow:hidden}
.aj__v [data-v]{overflow:hidden;text-overflow:ellipsis}
.aj.set .aj__v{opacity:1;font-style:normal}
.aj__c{width:13px;height:13px;flex-shrink:0;background-size:110px 110px;
  background-blend-mode:hard-light;opacity:0;transform:scale(.4);
  transition:opacity .45s var(--e),transform .5s var(--e)}
.aj.set .aj__c{opacity:1;transform:none}
.aj__p{font-size:9px;letter-spacing:.12em;opacity:.35;flex-shrink:0;white-space:nowrap}
.aj__f{width:11px;height:11px;flex-shrink:0;opacity:.3;
  fill:none;stroke:currentColor;stroke-width:1.3;
  transition:transform .4s var(--e),opacity .3s}
.aj:hover .aj__f{transform:translateX(3px);opacity:.8}

.tot{flex-shrink:0;padding-top:clamp(10px,2svh,18px);
  border-top:1px solid rgba(10,10,10,.22);
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.tot__l{font-size:9px;letter-spacing:.24em;text-transform:uppercase;opacity:.4}
.tot__v{font-size:clamp(24px,2.4vw,34px);margin-top:6px;display:flex}
.tot__v span{display:inline-block;white-space:pre}
.tot__v span.r{animation:chif .55s var(--e)}
@keyframes chif{0%{transform:translateY(-80%);opacity:0}100%{transform:none;opacity:1}}
.tot__go{font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  opacity:.6;position:relative;padding-bottom:7px;white-space:nowrap}
.tot__go::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:1px;
  background:currentColor;opacity:.5;transform:scaleX(1);transform-origin:right;
  transition:transform .45s var(--e)}
.tot__go:hover{opacity:1}.tot__go:hover::after{transform:scaleX(0)}

@media(max-width:900px){
  .atl__grid{grid-template-columns:1fr;
    grid-template-rows:minmax(0,44svh) minmax(0,1fr)}
  .atl__scene{min-height:0}
  .reps{top:58px;bottom:6px}
  .fiche{border-left:none;border-top:1px solid rgba(10,10,10,.12);
    padding:10px 16px 12px;min-height:0}
  .aj{padding:9px 2px}
  .aj__v{font-size:12px;margin-top:2px}
}

/* ═══ 3 · LA PLONGÉE — la matière prend l'écran ═══ */
.plg{position:fixed;inset:0;z-index:90;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .7s var(--e),visibility .7s;
  /* La plongée est TOUJOURS une salle sombre. Sans cette ligne elle héritait
     de body.clair (--txt:#0a0a0a) et affichait du noir sur du noir. */
  color:#fff}
.plg.on{opacity:1;visibility:visible;pointer-events:auto}
.plg{--plg-bas:clamp(190px,26svh,240px)}
.plg__bg{position:absolute;inset:0;transition:background 1.1s var(--e)}
.plg__stage{position:absolute;left:0;right:0;top:112px;
  /* la scène s'arrête au-dessus de la légende : le nom du cuir
     se posait par-dessus la matière */
  bottom:var(--plg-bas);overflow:hidden}
.plg__stage{perspective:1500px;perspective-origin:50% 50%;touch-action:none;cursor:grab}
.plg__stage.tire{cursor:grabbing}
.plg__sw{position:absolute;top:50%;left:50%;width:min(46vw,600px);height:100%;
  transform:translate(-50%,-50%);opacity:0;visibility:hidden;
  background-repeat:repeat;background-blend-mode:hard-light;
  box-shadow:0 30px 90px rgba(0,0,0,.55);
  transition:transform .82s var(--e),opacity .6s var(--e)}
/* Pendant le glissé la carte suit le doigt : aucune transition, sinon ça traîne. */
.plg__stage.tire .plg__sw{transition:none}
.plg__sw::after{content:'';position:absolute;inset:0;
  background:linear-gradient(104deg,rgba(255,255,255,.16) 0%,transparent 34%,
             transparent 66%,rgba(0,0,0,.30) 100%)}
.plg__sw.mid{box-shadow:0 46px 120px rgba(0,0,0,.72)}
.plg__glisse{position:absolute;left:0;right:0;bottom:12px;text-align:center;z-index:5;
  font-size:9px;letter-spacing:.26em;text-transform:uppercase;opacity:.22;
  pointer-events:none;transition:opacity .5s}
.plg.tire .plg__glisse{opacity:0}
.plg__hd{position:absolute;top:26px;left:0;right:0;z-index:5;
  display:flex;justify-content:space-between;padding:0 clamp(18px,3vw,40px)}
.plg__t{font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.6}
.plg__x{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.5}
.plg__x:hover{opacity:1}
.plg__fam{position:absolute;top:70px;left:0;right:0;z-index:5;
  display:flex;gap:20px;justify-content:center;flex-wrap:wrap;padding:0 18px}
.fm{font-size:9px;letter-spacing:.22em;text-transform:uppercase;opacity:.3;
  padding-bottom:6px;position:relative;transition:opacity .3s}
.fm::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:1px;background:currentColor;
  transform:scaleX(0);transform-origin:left;transition:transform .45s var(--e)}
.fm.on{opacity:1}.fm.on::after{transform:scaleX(1)}
.plg__cap{position:absolute;left:0;right:0;bottom:clamp(22px,5vh,48px);z-index:5;text-align:center}
.plg__n{font-size:clamp(28px,4.4vw,58px);letter-spacing:-.02em;min-height:1.1em}
.plg__d{font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:.5;margin-top:12px}
.plg__c{font-size:9px;letter-spacing:.26em;opacity:.28;margin-top:16px}
.plg__ok{margin-top:22px;border:1px solid rgba(255,255,255,.5);padding:14px 40px;
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  transition:background .3s,letter-spacing .45s var(--e)}
.plg__ok:hover{background:rgba(255,255,255,.12);letter-spacing:.3em}
.plg__a{position:absolute;top:50%;transform:translateY(-50%);z-index:6;
  width:46px;height:46px;display:flex;align-items:center;justify-content:center;opacity:.4}
.plg__a:hover{opacity:1}.plg__a:disabled{opacity:.1}
.plg__a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1}
.plg__a--p{left:clamp(6px,1.6vw,24px)}.plg__a--n{right:clamp(6px,1.6vw,24px)}

/* Plongée « choix simple » — mêmes codes, sans matière */
.plg__opts{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:5;width:min(520px,88vw)}
.op{display:flex;justify-content:space-between;align-items:center;gap:18px;width:100%;
  padding:20px 0;border-bottom:1px solid rgba(255,255,255,.13);text-align:left;
  transition:padding-left .4s var(--e),opacity .3s}
.op:first-child{border-top:1px solid rgba(255,255,255,.13)}
.op:hover{padding-left:12px}
.op__m{width:56px;height:56px;flex:0 0 56px;background-size:cover;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
  transition:transform .5s var(--e),box-shadow .4s}
.op:hover .op__m{transform:scale(1.06)}
.op.on .op__m{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 0 0 1px rgba(255,255,255,.35)}
.op__x{flex:1;min-width:0}
.op__n{font-size:17px;display:block}
.op__d{font-size:11px;opacity:.42;margin-top:5px;display:block;letter-spacing:.02em}
.op__p{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.4;white-space:nowrap}
.op.on .op__n::before{content:'— ';opacity:.6}
.op.on{opacity:1}
.plg__champ{width:100%;background:none;border:none;
  border-bottom:1px solid rgba(255,255,255,.3);color:#fff;
  font-family:inherit;font-size:32px;letter-spacing:.34em;text-align:center;
  padding:14px 0;outline:none;text-transform:uppercase}
.plg__champ::placeholder{opacity:.2}
.plg__rng{width:100%;-webkit-appearance:none;height:1px;background:rgba(255,255,255,.25);margin:34px 0 0}
.plg__rng::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;background:#fff;cursor:grab}
.plg__rng::-moz-range-thumb{width:15px;height:15px;border:none;background:#fff}

/* ═══ 4 · LE CERTIFICAT — un seul écran ═══ */
.cert{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:clamp(70px,10vh,110px) clamp(18px,4vw,44px) clamp(24px,5vh,50px)}
.cert__in{width:min(880px,100%);max-height:100%;display:flex;flex-direction:column}
.cert__h{text-align:center;margin-bottom:clamp(18px,3vh,32px);flex-shrink:0}
.cert__k{font-size:9px;letter-spacing:.34em;text-transform:uppercase;opacity:.4;margin-bottom:12px}
.cert__t{font-size:clamp(26px,4vw,48px);letter-spacing:-.025em}
.cert__t em{font-style:italic}
.cert__g{display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(24px,4vw,54px);
  border-top:1px solid rgba(255,255,255,.16);overflow-y:auto;scrollbar-width:none;flex:1;min-height:0}
.cert__g::-webkit-scrollbar{display:none}
.cl{display:flex;justify-content:space-between;gap:12px;padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.09);opacity:0;transform:translateY(8px);
  transition:opacity .6s var(--e),transform .7s var(--e)}
.cl.in{opacity:1;transform:none}
.cl__k{font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.4;flex-shrink:0}
.cl__v{font-size:13px;text-align:right}
.cl__v small{display:block;font-size:10px;opacity:.4;margin-top:2px;font-style:italic}
.cert__f{flex-shrink:0;margin-top:clamp(14px,2.5vh,26px);
  display:flex;justify-content:space-between;align-items:flex-end;gap:22px;flex-wrap:wrap}
.cert__tot{font-size:clamp(28px,3.6vw,46px);letter-spacing:-.02em}
.cert__tl{font-size:9px;letter-spacing:.26em;text-transform:uppercase;opacity:.4;margin-bottom:7px}
.cert__note{font-size:10px;line-height:1.7;opacity:.35;max-width:38ch;margin-top:14px;flex-basis:100%}
@media(max-width:760px){.cert__g{grid-template-columns:1fr}}

/* ═══ L'atelier passe en salle claire ═══
   Les packshots sont sur fond blanc : garder le chrome en texte blanc
   le rendrait invisible — le défaut exact rencontré sur le header. */
body.clair{--amb:#efeae3;--txt:#0a0a0a}
body.clair .hud__back,body.clair .hud__mark,body.clair .hud__idx{color:#0a0a0a}
body.clair .aj{border-color:rgba(10,10,10,.14);color:#0a0a0a}
body.clair .aj:hover{border-color:rgba(10,10,10,.5);background:rgba(10,10,10,.04)}
body.clair .aj.set{border-color:rgba(10,10,10,.42)}
body.clair .tot{color:#0a0a0a}
body.clair .rep__o{border-color:rgba(10,10,10,.5)}
body.clair .rep__o::after{background:#0a0a0a}
body.clair .rep:hover .rep__o{background:rgba(10,10,10,.12);border-color:#0a0a0a}
body.clair .rep.set .rep__o{background:#0a0a0a}
body.clair .rep.set .rep__o::after{background:#efeae3}
body.clair .rep__pulse{border-color:#0a0a0a}
body.clair .rep__l{color:#0a0a0a}

[hidden]{display:none!important}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .lig,.cl{opacity:1;transform:none}
}
</style>

<div class="hud">

<!-- ═══ 1 · LES BRIQUES ═══ -->
<section class="sc on" id="s1">
  <div class="dk" id="dk"></div>
  <div class="dk__inf">
    <p class="dk__t lig" id="dkT"></p>
    <h1 class="dk__n lig" id="dkN"></h1>
    <p class="dk__p lig" id="dkP"></p>
    <button class="btn lig" id="dkGo" data-go="0">Façonner cette pièce
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg></button>
  </div>
  <button class="arw arw--p" id="silP" aria-label="Précédente"><svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg></button>
  <button class="arw arw--n" id="silN" aria-label="Suivante"><svg viewBox="0 0 24 24"><polyline points="9,18 15,12 9,6"/></svg></button>
  <div class="sil__nav" id="silNav"></div>
</section>

<!-- ═══ 2 · L'ATELIER ═══ -->
<section class="sc atl" id="s2">
  <div class="atl__grid">
    <div class="atl__scene">
      <div class="atl__ph" id="atlPh0">
        <img id="atlPh" src="" alt=""
             onerror="this.closest('.atl__ph').classList.add('nofile')">

        <div class="atl__grain" id="atlGrain"></div>
        <div class="atl__mue"></div>
      </div>
      <div class="reps" id="reps"></div>
    </div>
    <aside class="fiche">
      <p class="fiche__k">Votre pièce, ligne à ligne</p>
      <div class="fiche__l" id="fiche"></div>
      <div class="tot">
        <div><p class="tot__l">Estimation</p><p class="tot__v" id="tot">—</p></div>
        <button class="tot__go" id="toCert">Voir la pièce achevée</button>
      </div>
    </aside>
  </div>
</section>

<!-- ═══ 3 · LE CERTIFICAT ═══ -->
<section class="sc" id="s3">
  <div class="cert"><div class="cert__in">
    <div class="cert__h">
      <p class="cert__k">Pièce unique · Atelier Tiraboschi</p>
      <h1 class="cert__t" id="certT">Votre <em>Victoire</em></h1>
    </div>
    <div class="cert__g" id="certG"></div>
    <div class="cert__f">
      <div><p class="cert__tl">Estimation ferme</p><p class="cert__tot" id="certTot"></p></div>
      <button class="btn" id="envoyer">Confier à mon conseiller
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg></button>
      <p class="cert__note">Un cuir exotique reste soumis à disponibilité en tannerie.
        Façonnage : 12 à 16 semaines. Rien n'est engagé à ce stade.</p>
    </div>
  </div></div>
</section>

</div>

function habillerEl(el,m,taille){

}

function peindre(el,o,taille){
  if(!el)return;

  if(!o||(!o.f&&!o.g&&!o.tx))return;

    el.style.backgroundColor=o.f;el.style.backgroundBlendMode='hard-light';
    if(taille)el.style.backgroundSize=taille+'px '+taille+'px';
    return;
  }
  el.style.backgroundColor=o.f;
  if(o.g){el.style.backgroundImage=o.g;el.style.backgroundSize='auto'}
}

function fonceCap(h,k){
  /* Le fond de la plongée doit rester assez sombre pour que le blanc tienne :
     une craie à 30 % passait encore trop clair sur certains écrans. */
  var n=parseInt(h.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  var l=(.2126*r+.7152*g+.0722*b)/255;
  var f=Math.min(k,l>.001?(0.13/l):k);
  return '#'+((1<<24)+(Math.round(r*f)<<16)+(Math.round(g*f)<<8)+Math.round(b*f)).toString(16).slice(1);
}

/* ═══ Le glissé — un seul moteur pour les briques et le cover flow ═══
   Pointer Events + capture ; les cartes suivent le doigt en continu,
   résistance aux deux bouts, l'élan prolonge le geste au relâché. */
function glisser(el,o){
  var id=null,x0=0,t0=0,dx=0,pas=1;
  el.addEventListener('pointerdown',function(e){
    if(o.actif&&!o.actif())return;
    id=e.pointerId;x0=e.clientX;dx=0;t0=e.timeStamp;pas=o.pas();
    el.classList.add('tire');if(o.debut)o.debut();
    try{el.setPointerCapture(id)}catch(_){}
  });
  el.addEventListener('pointermove',function(e){
    if(id===null||e.pointerId!==id)return;
    dx=e.clientX-x0;
    var off=-dx/pas,c=o.cur()+off,n=o.n()-1;
    if(c<0)off=-o.cur()+(c*0.34);
    else if(c>n)off=(n-o.cur())+((c-n)*0.34);
    o.place(off);
  });
  function fin(e){
    if(id===null||e.pointerId!==id)return;
    id=null;el.classList.remove('tire');if(o.finTire)o.finTire();
    var dt=Math.max(1,e.timeStamp-t0);
    if(Math.abs(dx)<7){
      var c=document.elementFromPoint(e.clientX,e.clientY);
      var i=o.cible?o.cible(c):null;
      if(i!==null&&i!==undefined)o.aller(i);else o.place(0);
      return;
    }
    var v=dx/dt;
    o.aller(o.cur()+Math.round(-dx/pas-v*2.4/pas*100));
  }
  el.addEventListener('pointerup',fin);
  el.addEventListener('pointercancel',fin);
}

  var id=S.cuirs.ext||'',t=$('atlTeint'),g=$('atlGrain'),ph=$('atlPh0');

    b.querySelector('[data-v]').textContent=v[0];
    b.querySelector('[data-p]').textContent=v[1]===null?'à définir':(v[1]?'+ '+euros(v[1]):'inclus');
    var pose=(a.type==='cuir'&&S.cuirs[a.k])||(a.type==='range'&&S.anse!==50)||
             (a.type==='texte'&&S.grav)||(a.l&&v[1]>0);
    b.classList.toggle('set',!!pose);
    var ch=chromeDe(a);
    var chip=b.querySelector('[data-c]');
    if(chip){
      if(ch&&ch.cuir)habillerEl(chip,ch.cuir,110);
      else peindre(chip,ch&&ch.opt,26);
    }
    var rp=document.querySelector('.rep[data-k="'+b.dataset.k+'"]');
    if(rp){
      rp.classList.toggle('set',!!pose);
      var sw=rp.querySelector('.rep__sw');
      if(sw){
        if(ch&&ch.cuir)habillerEl(sw,ch.cuir,150);
        else{peindre(sw,ch&&ch.opt,44);
             if(!sw.style.backgroundColor)sw.style.backgroundColor='#fff'}
      }
      var rv=rp.querySelector('[data-rv]');
      if(rv)rv.textContent=pose?(' · '+v[0]):'';
    }
  });
  habillerPiece();
}

/* ═══ 3 · La plongée ═══
   En haut : les sept matières. Au centre : les 52 nuances en cover flow.
   Changer de matière ré-habille les cartes SANS perdre la nuance visée. */
var pl=null,typ='graine',pi=0;
function listeC(){return COULEURS}
TYPES.forEach(function(f){
  var b=document.createElement('button');
  b.className='fm'+(f.id===typ?' on':'');b.textContent=f.n;b.dataset.f=f.id;
  b.addEventListener('click',function(){
    typ=f.id;
    document.querySelectorAll('.fm').forEach(function(x){x.classList.toggle('on',x.dataset.f===f.id)});
    rhabiller();legende(pi);
  });
  $('plgFam').appendChild(b);
});
function matiere(i){
  var c=COULEURS[i],t=typePar(typ);
  return {id:typ+':'+c.id,nom:c.nom,c:c.c,delta:t.d,tx:t.tx};
}
var cartes=[];
/* Le cover flow ne se reconstruit plus à chaque pas : les cartes restent en
   place et seul leur transform change. C'est ce qui rend le mouvement — avant,
   innerHTML='' recréait tout et les transitions CSS ne partaient jamais. */
function batirCartes(){
  var st=$('plgStage');
  st.innerHTML='';cartes=[];
  COULEURS.forEach(function(c,i){
    var d=document.createElement('div');
    d.className='plg__sw';
    habillerEl(d,matiere(i),512);   /* taille native de la tuile : aucune couture */
    d.dataset.i=i;
    cartes.push(d);st.appendChild(d);
  });
  placer(0);
}
function rhabiller(){
  /* changement de matière : mêmes cartes, nouvelle peau */
  cartes.forEach(function(d,i){habillerEl(d,matiere(i),512)});
}
/* off = décalage continu pendant le glissé (en nombre de cartes). */
function placer(off){
  var c=pi+off;
  for(var i=0;i<cartes.length;i++){
    var d=cartes[i],o=i-c,a=Math.abs(o);
    if(a>3.8){
      if(d.style.visibility!=='hidden'){d.style.visibility='hidden';d.style.opacity='0'}
      continue;
    }
    var sg=o<0?-1:1,ac=Math.min(a,4);
    d.style.visibility='visible';
    d.style.transform='translate(calc(-50% + '+(sg*36*Math.pow(ac,.78)).toFixed(2)+'%),-50%) '+
      'rotateY('+(-sg*46*Math.min(ac,1)).toFixed(2)+'deg) '+
      'scale('+(1-.16*Math.min(ac,3)).toFixed(3)+')';
    d.style.opacity=(a<=1?(1-.46*a):Math.max(.07,.54-.15*(a-1))).toFixed(3);
    d.style.zIndex=String(60-Math.round(ac*10));
    d.classList.toggle('mid',a<.5);
  }
}
var fondPose='';
function legende(idx){
  var m=matiere(idx),t=typePar(typ);
  $('plgNom').textContent=m.nom;
  $('plgD').textContent=t.n+' · '+(t.d?'+ '+euros(t.d):'sans supplément');
  $('plgC').textContent=(idx+1)+' sur '+COULEURS.length;
  if(m.c!==fondPose){
    fondPose=m.c;
    $('plgBg').style.background=
      'radial-gradient(ellipse at 50% 40%,'+fonceCap(m.c,.34)+' 0%,'+fonceCap(m.c,.16)+' 100%)';
  }
  $('plgP').disabled=idx<=0;$('plgN').disabled=idx>=COULEURS.length-1;
}
function rendreC(){placer(0);legende(pi)}
function allerA(n){
  var L=listeC();
  pi=Math.max(0,Math.min(L.length-1,n));
  placer(0);legende(pi);
}
function plonger(a){
  pl=a;
  $('plgT').textContent=a.n;
  var estCuir=a.type==='cuir';
  $('plgFam').hidden=!estCuir;$('plgStage').hidden=!estCuir;
  $('plgP').hidden=!estCuir;$('plgN').hidden=!estCuir;
  $('plgOpts').hidden=estCuir;
  $('plgOk').textContent=estCuir?'Retenir ce cuir':'Valider';
  $('plgGlisse').hidden=!estCuir;
  if(estCuir){
    var d=S.cuirs[a.k];
    if(d){
      var q=d.split(':');
      if(typePar(q[0]))typ=q[0];
      var i=COULEURS.findIndex(function(c){return c.id===q[1]});if(i>=0)pi=i;
    }
    document.querySelectorAll('.fm').forEach(function(x){x.classList.toggle('on',x.dataset.f===typ)});
    batirCartes();legende(pi);
    $('plgNom').style.display='';$('plgD').style.display='';$('plgC').style.display='';
  }else{
    fondPose='';$('plgBg').style.background='#0a0a0a';
    $('plgNom').style.display='none';$('plgD').style.display='none';$('plgC').style.display='none';
    var o=$('plgOpts');o.innerHTML='';
    if(a.type==='liste'){
      a.l.forEach(function(x){
        var b=document.createElement('button');
        b.className='op'+(S[a.k]===x.id?' on':'');b.dataset.id=x.id;
        b.innerHTML='<i class="op__m"></i>'+
          '<span class="op__x"><span class="op__n">'+x.n+'</span>'+
          '<span class="op__d">'+x.d2+'</span></span>'+
          '<span class="op__p">'+(x.d?'+ '+euros(x.d):'inclus')+'</span>';
        peindre(b.querySelector('.op__m'),x,56);
        b.addEventListener('click',function(){
          S[a.k]=x.id;
          o.querySelectorAll('.op').forEach(function(y){y.classList.toggle('on',y.dataset.id===x.id)});
          majTotal();rafraichir();
        });
        o.appendChild(b);
      });
    }else if(a.type==='range'){
      o.innerHTML='<p class="plg__n" id="rngL" style="text-align:center">'+valeur(a)[0]+'</p>'+
        '<input class="plg__rng" type="range" min="0" max="100" value="'+S.anse+'">'+
        '<p class="plg__d" style="text-align:center;margin-top:18px">Le réglage se fait au centimètre en atelier.</p>';
      o.querySelector('.plg__rng').addEventListener('input',function(){
        S.anse=+this.value;$('rngL').textContent=valeur(a)[0];majTotal();rafraichir();
      });
    }else{
      o.innerHTML='<input class="plg__champ" id="gv" maxlength="4" placeholder="V.T." value="'+S.grav+'">'+
        '<p class="plg__d" style="text-align:center;margin-top:22px">Gravée à chaud sous la couture de rabat.</p>';
      o.querySelector('#gv').addEventListener('input',function(){
        S.grav=this.value.toUpperCase().slice(0,4);majTotal();rafraichir();
      });
    }
  }
  $('plg').classList.add('on');
  document.querySelector('.atl').classList.add('zoom');
}
function fermerP(){
  $('plg').classList.remove('on');
  document.querySelector('.atl').classList.remove('zoom');
}
$('plgX').addEventListener('click',fermerP);
$('plgP').addEventListener('click',function(){allerA(pi-1)});
$('plgN').addEventListener('click',function(){allerA(pi+1)});
glisser($('plgStage'),{
  n:function(){return COULEURS.length},
  cur:function(){return pi},
  pas:function(){return Math.max(70,$('plgStage').clientWidth*0.17)},
  actif:function(){return pl&&pl.type==='cuir'},
  debut:function(){$('plg').classList.add('tire')},
  finTire:function(){$('plg').classList.remove('tire')},
  place:function(off){
    placer(off);
    legende(Math.max(0,Math.min(COULEURS.length-1,Math.round(pi+off))));
  },
  aller:function(i){allerA(i)},
  cible:function(el){
    var sw=el&&el.closest?el.closest('.plg__sw'):null;
    return sw?+sw.dataset.i:null;
  }
});
$('plgOk').addEventListener('click',function(){
  if(pl&&pl.type==='cuir')S.cuirs[pl.k]=typ+':'+COULEURS[pi].id;
  majTotal();rafraichir();fermerP();
});
document.addEventListener('keydown',function(e){
  if($('plg').classList.contains('on')){
    if(e.key==='Escape')fermerP();
    if(pl&&pl.type==='cuir'){
      if(e.key==='ArrowLeft')allerA(pi-1);
      if(e.key==='ArrowRight')allerA(pi+1);
    }
    return;
  }
  if(S.ecran===1){
    if(e.key==='ArrowLeft')vBk(si-1);
    if(e.key==='ArrowRight')vBk(si+1);
  }
});

/* ═══ 4 · Le certificat ═══ */
function certificat(){
  $('certT').innerHTML='Votre <em>'+S.mdl.nom2+'</em>';
  var g=$('certG');g.innerHTML='';
  var L=[['Silhouette',S.mdl.nom2,S.mdl.t+' · '+euros(S.mdl.base)]];
  AJ.forEach(function(a){
    if(!ajPourModele(a))return;
    var v=valeur(a);
    if(v[1]===null){L.push([a.n,'Choix de la maison','—']);return}
    L.push([a.n,v[0],v[1]?'+ '+euros(v[1]):'inclus']);
  });
  L.forEach(function(l,i){
    var d=document.createElement('div');d.className='cl';
    d.innerHTML='<span class="cl__k">'+l[0]+'</span><span class="cl__v">'+l[1]+
      '<small>'+l[2]+'</small></span>';
    g.appendChild(d);
    setTimeout(function(){d.classList.add('in')},RM?0:70+i*48);
  });
  $('certTot').textContent=euros(total());
}
$('toCert').addEventListener('click',function(){certificat();aller(3)});
$('envoyer').addEventListener('click',function(){
  alert('Spécification confiée à votre conseiller.\n\n'+S.mdl.nom2+
    ' — '+euros(total())+'\n\nDémonstration : en production, elle part au conseiller '+
    'qui établit le devis et le lien de paiement.');
});

/* ═══ Navigation — le fil d'étapes permet d'aller et venir librement ═══ */
function aller(n){
  S.ecran=n;
  [1,2,3].forEach(function(i){$('s'+i).classList.toggle('on',i===n)});
  document.querySelectorAll('.pa').forEach(function(b){
    b.classList.toggle('on',+b.dataset.s===n);
    if(+b.dataset.s>1)b.disabled=!S.mdl;
  });
  document.body.classList.toggle('clair',n===2);
  document.documentElement.style.setProperty('--amb',
    n===2?'#efeae3':(n===3?'#0d0d0d':'#0a0a0a'));
  var m=$('mark');m.classList.add('br');setTimeout(function(){m.classList.remove('br')},760);
  if(n===1)ligner();
}
document.querySelectorAll('.pa').forEach(function(b){
  b.addEventListener('click',function(){
    var n=+b.dataset.s;
    if(n>1&&!S.mdl)return;
    if(n===3)certificat();
    aller(n);
  });
});

/* Crochets de recette — lus par tests/atelier/recette.js */
window.__mat=function(){return COULEURS};
window.__pi=function(){return pi};
window.__fond=function(c){return 'radial-gradient(ellipse at 50% 40%,'+fonceCap(c,.34)+' 0%,'+fonceCap(c,.16)+' 100%)'};

vBk(0);ligner();majTotal();
})();
</script>
