<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<title>TIRABOSCHI · Le tour de la pièce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   LE TOUR DE LA PIÈCE — configurateur photographique
   Même grammaire d'interaction qu'une expérience produit en 3D
   (carrousel de modèles, rotation continue, rail d'éléments, zoom
   matière), mais bâtie sur de VRAIES PRISES DE VUE : 138 vues du
   shooting du 8 septembre, cinq tours complets.

   Sur du cuir, la photographie bat le rendu : une écaille d'alligator,
   une tranche teinte, un grain de galuchat ne se calculent pas.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --blanc:#ffffff; --papier:#faf9f7; --encre:#101010; --gris:#767472;
  --trait:#e6e4e0; --or:#a08553; --nuit:#0c0c0d;
  --e:cubic-bezier(.16,1,.3,1); --barre:38px; --ent:88px;
  --haut:calc(var(--ent) + var(--barre));
  /* la toile du studio, relevée sur les prises de vue elles-mêmes :
     la page porte EXACTEMENT sa couleur, donc le bord du plateau ne
     se voit pas. Et une teinte de la peau choisie vient l'habiller. */
  /* La pièce étant détourée, le fond est un CHOIX. Vincent a tranché :
     papier — cohérent avec la galerie blanche de la maison, et
     justement pas le registre néon sombre de la référence. */
  --papier2:#f2efea; --ambiance:#5e1a20;
}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
html,body{height:100%;overflow:hidden}
body{font-family:'Playfair Display',Georgia,serif;background:var(--papier2);color:var(--encre);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
/* UNE IMAGE SE GLISSE, PAR DÉFAUT. Le navigateur démarre son
   glisser-déposer natif dès le premier mouvement et ÉMET UN
   `pointercancel` : la prise était perdue au bout d'un pixel, et la
   pièce s'arrêtait de tourner sous le doigt. Mesuré : trois
   `pointermove` seulement sur les sept envoyés. C'était là, la
   raideur. */
img{display:block;-webkit-user-drag:none;user-drag:none}
.tour,.car{user-select:none;-webkit-user-select:none}
.cap{font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.28em;
  text-transform:uppercase}

/* ═══════════ L'EN-TÊTE ═══════════ */
.ent{position:fixed;top:0;left:0;right:0;height:var(--ent);z-index:70;display:flex;
  align-items:center;gap:clamp(12px,2.4vw,28px);padding:0 clamp(14px,2.6vw,32px);
  color:var(--encre);border-bottom:1px solid rgba(16,16,16,.1)}
.ent__n{display:flex;align-items:center;gap:clamp(14px,1.9vw,26px);flex:1 1 0;min-width:0}
.ent__n--d{justify-content:flex-end}
.ent__logo{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:clamp(19px,2.1vw,29px);letter-spacing:.4em;text-transform:uppercase;
  text-indent:.4em;white-space:nowrap;line-height:1}
.ent__logo small{font-family:system-ui,sans-serif;font-size:8.5px;letter-spacing:.28em;
  opacity:.5;text-transform:uppercase;text-indent:.28em}
.lien{font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.2em;
  font-size:11px;opacity:.6;transition:opacity .3s;white-space:nowrap}
.lien:hover,.lien.on{opacity:1}
@media(max-width:900px){.ent__n .lien{display:none}}

/* ═══════════ LES SCÈNES ═══════════ */
/* un fondu court : au-delà, les pièces du carrousel flottent encore
   derrière celle du configurateur, et l'on croit à une superposition */
.scene{position:fixed;inset:var(--ent) 0 0;opacity:0;visibility:hidden;
  transition:opacity .38s var(--e),visibility .38s;display:flex;flex-direction:column}
.scene.on{opacity:1;visibility:visible}
/* l'ambiance suit la peau choisie — c'est elle qui colore la salle */
/* Les pièces sont DÉTOURÉES : la salle peut donc être ce qu'on veut.
   On la fait sombre, et c'est la peau choisie qui l'éclaire par le bas
   — comme un projecteur de studio derrière l'objet. */
.fond{position:fixed;inset:0;z-index:-1;background:var(--papier2);
  transition:background 1.2s var(--e)}
/* la teinte du cuir se pose en lavis dans les angles : on la sent, la
   pièce reste la seule couleur franche de l'écran */
.fond::after{content:'';position:absolute;inset:0;
  background:radial-gradient(96% 76% at 50% 108%,var(--ambiance) 0%,transparent 62%);
  opacity:.09;transition:background 1.4s var(--e)}
/* et une lumière douce derrière la pièce, comme un fond de studio */
.fond::before{content:'';position:absolute;left:50%;top:42%;
  transform:translate(-50%,-50%);width:min(1200px,92vw);height:74%;
  background:radial-gradient(50% 50% at 50% 50%,#fdfcfb,transparent 72%)}

/* ── LE CARROUSEL DES MODÈLES ── */
.car{flex:1;min-height:0;display:flex;flex-direction:column;touch-action:pan-y}
/* la scène et le cartel ne se disputent plus la place : la pièce a sa
   bande, le texte a la sienne */
.car__s{position:relative;flex:1;min-height:0}
/* LA PIÈCE AU CENTRE TIENT LA MOITIÉ DE L'ÉCRAN. Les prises de vue
   font 1400 px : on peut les montrer grand sans les agrandir. Et elles
   sont CLIQUABLES — cliquer sur une pièce du côté l'amène au centre,
   cliquer sur celle du centre entre dedans.
   LA BOÎTE EST POSÉE EN PIXELS PAR LE JS, au format exact de la vue.
   En CSS on ne sait pas le faire : `width:100%` + `max-height` en
   pourcentage sur un parent de hauteur automatique donne un cadre au
   mauvais format, et l'image s'y écrase — l'anse de la Colette
   s'aplatissait, c'est le défaut que le client a vu. */
/* PAS DE TRANSITION SUR `transform` : l'éventail est animé image par
   image en JS. Une transition par-dessus poursuit une cible qui bouge
   à chaque image — la tuile n'est jamais « stable », l'easing se joue
   deux fois, et un clic sur une voisine attend indéfiniment qu'elle
   s'arrête. */
.car__p{position:absolute;left:50%;top:50%;pointer-events:none;
  transform-origin:50% 50%;
  transition:opacity .5s var(--e),filter .5s var(--e)}
.car__p img{width:100%;height:100%;object-fit:contain}
/* ON CLIQUE LE SAC, PAS SON CADRE. Une vue détourée est aux deux tiers
   transparente : le cadre de la pièce du centre recouvre celui de ses
   voisines, et l'on ne peut plus les atteindre — d'autant que
   l'éventail les serre. La cible suit donc la matière. */
.car__h{position:absolute;left:50%;top:48.8%;transform:translate(-50%,-50%);
  pointer-events:auto;cursor:pointer}
.car__p--ici .car__h{cursor:zoom-in}
/* le cartel se serre : chaque pixel qu'il rend, la pièce le prend */
.car__x{flex-shrink:0;z-index:3;text-align:center;pointer-events:none;
  padding:0 20px clamp(26px,3.6vh,40px)}
.car__n{font-size:clamp(22px,3vw,40px);letter-spacing:-.03em;line-height:1;
  transition:opacity .5s}
.car__n em{font-style:italic}
.car__k{margin-top:9px;opacity:.55}
.car__go{margin-top:13px;pointer-events:auto;border:1px solid currentColor;
  padding:14px 32px;font-family:system-ui,sans-serif;text-transform:uppercase;
  letter-spacing:.2em;font-size:10px;min-height:46px;
  transition:background .45s var(--e),color .45s,letter-spacing .5s var(--e)}
.car__go:hover{background:var(--encre);color:var(--papier2);letter-spacing:.26em}
.car__f{position:absolute;top:42%;transform:translateY(-50%);z-index:4;width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;opacity:.4;transition:opacity .3s}
.car__f:hover{opacity:1}
.car__f svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1}
.car__f--p{left:clamp(8px,3vw,44px)}.car__f--n{right:clamp(8px,3vw,44px)}
.car__j{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;
  width:min(280px,52vw);height:1px;background:rgba(16,16,16,.14)}
.car__j i{display:block;height:100%;background:var(--encre);transition:width .7s var(--e),
  margin-left .7s var(--e)}
/* le compte des pièces, en clair */
.car__c{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;
  font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gris)}

/* ── LA PIÈCE QUI TOURNE ── */
/* LA PIÈCE EST LE SUJET : elle prend le milieu, en grand. Le cartel se
   range à gauche sur une colonne étroite, le rail des éléments à
   droite sur sa seule largeur. */
/* LES DEUX COLONNES DE BORD ONT LA MÊME LARGEUR, et ce n'est pas une
   coquetterie : avec un rail « auto » à droite et un cartel de .62fr à
   gauche, le centre de la colonne du milieu tombait 163 px à droite du
   centre de l'écran. La pièce paraissait décalée — elle l'était. */
.piece{flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,2.05fr) minmax(0,1fr);
  gap:clamp(14px,2.6vw,42px);padding:clamp(14px,2.6vh,34px) clamp(16px,3vw,48px)
  clamp(10px,2vh,24px)}
@media(max-width:1000px){
  .piece{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
}
/* le cartel, à gauche */
.dit{display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}
.dit__k{color:var(--gris)}
.dit__t{font-size:clamp(21px,2.5vw,36px);letter-spacing:-.028em;line-height:1.06}
.dit__t em{font-style:italic}
.dit__d{font-family:system-ui,sans-serif;font-size:12px;line-height:1.85;
  color:#3d3b39;max-width:40ch}
.dit__z{position:relative;width:100%;height:0;padding-top:68%;
  overflow:hidden;background:#e4e0da;margin-top:4px;cursor:zoom-in;
  border:1px solid rgba(16,16,16,.12)}
.dit__z img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .8s var(--e),transform 2.4s var(--e);transform:scale(1.08)}
.dit__z img.on{opacity:1;transform:none}
.dit__zl{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:10px 14px;
  background:linear-gradient(to top,rgba(10,10,10,.7),transparent);
  font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.22em;
  text-transform:uppercase;color:rgba(255,255,255,.85)}
@media(max-width:1000px){
  .dit{gap:9px}.dit__z{display:none}
  /* l'invitation revient DANS LE FLUX : en surimpression elle tombait
     en plein sur la pièce, faute de marge autour d'elle */
  .tour__s{position:static;order:3;margin-top:8px}
  .tour__r{bottom:auto;top:8px}
}
/* le texte ne mange pas la pièce, et rien n'est caché pour autant :
   il défile dans sa bande */
@media(max-width:820px){
  .dit__d{font-size:11.5px;line-height:1.65;max-height:5em;overflow-y:auto}
}

/* la scène : c'est ici que la pièce tourne */
.tour{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-width:0;min-height:0;touch-action:none;cursor:grab}
.tour.tire{cursor:grabbing}
/* la lucarne : c'est elle qui borne le rapprochement. Sans elle, une
   pièce qu'on approche déborde sur le cartel et sur les choix. */
.tour__c{position:relative;width:100%;--lucarne:none;
  height:min(100%,calc(100svh - var(--ent) - 170px));overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  -webkit-mask-image:var(--lucarne);mask-image:var(--lucarne)}
/* de près, la pièce dépasse du cadre : sans ce fondu, elle est
   tranchée net par un bord droit, et la coupe se voit plus que
   l'approche. ATTENTION AUX RAYONS : dans `radial-gradient(a b ...)`,
   a et b sont les RAYONS de l'ellipse, en pourcentage de la largeur et
   de la hauteur de la boîte — pas son diamètre. À 125 %, la bordure
   tombait à 40 % du rayon, donc en plein dans la partie opaque, et le
   fondu ne se voyait pas du tout. Trop court, à l'inverse (64 %), il
   mangeait la pièce elle-même : un profil étroit se retrouvait à
   moitié délavé. À 80 %, le bord droit du cadre reste franc et seuls
   les angles s'estompent. */
.tour.pres .tour__c{--lucarne:radial-gradient(80% 80% at 50% 50%,#000 76%,transparent 104%)}
/* LA BOÎTE EST POSÉE EN PIXELS, AU FORMAT EXACT DE LA VUE (voir
   `cadrer()`). En flex, une image à `height:auto` bornée par un
   `max-height` en pourcentage sur un parent de hauteur automatique
   s'étire dans le sens de la contrainte : l'anse s'aplatissait et le
   bas sortait du cadre. Une boîte au bon format, et `contain` n'a plus
   rien à recadrer. */
.tour__im{position:relative;--z:1;
  transition:transform .9s var(--e);will-change:transform}
.tour__im>img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;z-index:1}
/* L'OMBRE SE COMPOSE SUR TOUT LE CADRE, pas sur une bande devinée
   sous la pièce : le fichier `-o.webp` est la TOILE ENTIÈRE, réduite,
   avec l'ombre dessinée à sa vraie place. Posée à 86 % de large et
   décalée de 42 %, elle tombait n'importe où — et de toute façon la
   page ne l'accrochait jamais. */
.tour__o{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.55;
  transition:opacity .8s var(--e)}
.tour__o img{width:100%;height:100%;object-fit:fill;position:static}
/* LES POINTS SUR LA PIÈCE — on désigne l'élément SUR l'objet, pas
   seulement dans un rail. Ils se posent en coordonnées normalisées DE
   L'IMAGE, pas de la scène : en % du conteneur ils tombaient à côté de
   la pièce, la scène faisant toute la largeur et la pièce le centre.
   Et ils ne s'affichent qu'aux angles où l'élément se voit. */
/* LE REPÈRE NE GROSSIT PAS AVEC LA PIÈCE. Il vit dans le cadre, donc
   il subit l'agrandissement du rapprochement ; on le lui retire avec
   `--z`, tenu à 1/k par `approcher()`. Sinon un losange de 30 px en
   fait 78 dès qu'on s'approche, et il masque ce qu'il désigne. */
.pt{position:absolute;z-index:4;width:30px;height:30px;margin:-15px 0 0 -15px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(calc(.7 * var(--z,1)));pointer-events:none;
  transition:opacity .45s var(--e),transform .45s var(--e)}
.pt.vu{opacity:1;transform:scale(var(--z,1));pointer-events:auto}
.pt::before{content:'';position:absolute;inset:0;border:1px solid rgba(16,16,16,.55);
  transform:rotate(45deg);transition:background .35s var(--e),border-color .35s}
.pt::after{content:'';width:4px;height:4px;background:var(--encre);position:relative;z-index:1;
  transition:transform .35s var(--e)}
.pt:hover::before,.pt.on::before{background:rgba(255,255,255,.7);border-color:var(--encre)}
.pt:hover::after{transform:scale(1.6)}
.pt.on::before{background:var(--encre)}
.pt.on::after{background:var(--papier2)}
.pt__n{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);
  font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;white-space:nowrap;color:var(--encre);
  opacity:0;transition:opacity .3s;pointer-events:none;
  text-shadow:0 1px 6px rgba(255,255,255,.8)}
.pt:hover .pt__n,.pt.on .pt__n{opacity:1}
/* le pas en arrière, qui ne paraît que lorsqu'on s'est approché */
.tour__r{position:absolute;left:50%;transform:translateX(-50%) translateY(6px);
  bottom:40px;z-index:6;font-family:system-ui,sans-serif;font-size:9px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--encre);
  background:rgba(255,255,255,.86);backdrop-filter:blur(6px);
  border:1px solid rgba(16,16,16,.2);padding:11px 18px;min-height:40px;
  opacity:0;pointer-events:none;
  transition:opacity .45s var(--e),transform .45s var(--e),background .35s}
.tour.pres .tour__r{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.tour__r:hover{background:#fff}
/* l'invitation, qui s'efface au premier geste */
.tour__s{position:absolute;left:0;right:0;bottom:44px;z-index:3;text-align:center;
  pointer-events:none;font-family:system-ui,sans-serif;text-transform:uppercase;
  letter-spacing:.24em;font-size:9px;color:var(--gris);
  display:flex;align-items:center;justify-content:center;gap:12px;
  transition:opacity .6s var(--e)}
.tour.deja .tour__s,.tour.pres .tour__s{opacity:0}
.tour__s svg{width:26px;height:14px;fill:none;stroke:currentColor;stroke-width:1}
.tour__s path{stroke-dasharray:34;stroke-dashoffset:34;animation:filer 2.8s var(--e) infinite}
@keyframes filer{0%{stroke-dashoffset:34}45%{stroke-dashoffset:0}
  70%{stroke-dashoffset:0;opacity:1}90%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
/* la ligne de chargement de la séquence */
.tour__ch{position:absolute;left:50%;transform:translateX(-50%);bottom:72px;z-index:4;
  width:min(220px,44vw);height:1px;background:rgba(16,16,16,.14);
  opacity:0;transition:opacity .4s}
.tour__ch.on{opacity:1}
.tour__ch i{display:block;height:100%;width:0;background:var(--or);transition:width .2s linear}
/* LA PRISE EN MAIN — l'autre façon de tenir la pièce. Sous le rail
   d'angle et non dedans : à 9 px et .2em d'interlettrage, le libellé
   fait 190 px, et le rail n'en a que 420. */
.tour__m{flex-shrink:0;margin-top:clamp(6px,1.2vh,12px);
  font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gris);white-space:nowrap;
  border-bottom:1px solid transparent;padding:3px 1px;
  transition:color .35s var(--e),border-color .35s var(--e)}
.tour__m:hover{color:var(--encre);border-color:rgba(16,16,16,.28)}
.tour.main .tour__m{color:var(--encre);border-color:var(--encre)}
/* en main, le curseur dit qu'on porte et non qu'on tourne */
.tour.main{cursor:grab}
.tour.main.tire{cursor:grabbing}
/* le rail d'angle, sous la pièce */
.rot{flex-shrink:0;width:min(420px,84%);margin-top:clamp(8px,1.6vh,18px);
  display:flex;align-items:center;gap:14px}
.rot__l{font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gris);white-space:nowrap}
.rot__p{flex:1;min-width:0;height:24px;position:relative;cursor:pointer;
  touch-action:none;display:flex;align-items:center}
.rot__p::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;
  background:rgba(16,16,16,.14)}
.rot__t{position:absolute;top:50%;transform:translate(-50%,-50%);width:1px;height:12px;
  background:var(--encre);transition:left .28s var(--e)}

/* ── LE RAIL DES ÉLÉMENTS, à droite ── */
.rail{display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.4vh,14px);
  flex-shrink:0;justify-self:end}
@media(max-width:1000px){
  .rail{flex-direction:row;justify-content:center;flex-wrap:wrap;gap:9px;
    justify-self:center}
}
.el{width:50px;height:50px;position:relative;display:flex;align-items:center;
  justify-content:center;border:1px solid rgba(16,16,16,.18);
  transition:border-color .4s var(--e),background .4s var(--e)}
.el:hover{border-color:rgba(16,16,16,.55)}
.el.on{background:rgba(16,16,16,.07);border-color:var(--encre)}
.el svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1;
  stroke-linecap:square;stroke-linejoin:miter}
.el__n{position:absolute;right:calc(100% + 12px);top:50%;transform:translateY(-50%);
  font-family:system-ui,sans-serif;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .3s,right .4s var(--e)}
.el:hover .el__n{opacity:.8;right:calc(100% + 16px)}
@media(max-width:1000px){.el__n{display:none}}

/* ── LES CHOIX, en bas ── */
.choix{flex-shrink:0;border-top:1px solid rgba(16,16,16,.12);
  padding:clamp(10px,2vh,20px) clamp(16px,3vw,48px) clamp(14px,2.4vh,26px);
  display:flex;align-items:center;gap:clamp(14px,2.4vw,32px);min-height:96px}
.choix__k{flex-shrink:0;color:var(--gris);white-space:nowrap}
.choix__l{flex:1;min-width:0;display:flex;gap:clamp(8px,1.2vw,16px);overflow-x:auto;
  scrollbar-width:none;padding:2px 0}
.choix__l::-webkit-scrollbar{display:none}
.ch{flex-shrink:0;display:flex;align-items:center;gap:11px;padding:9px 14px 9px 9px;
  border:1px solid rgba(16,16,16,.16);transition:border-color .4s var(--e),
  background .4s var(--e)}
.ch:hover{border-color:rgba(16,16,16,.5)}
.ch.on{border-color:var(--encre);background:rgba(16,16,16,.05)}
.ch__p{width:34px;height:34px;flex-shrink:0;background-size:cover;background-position:center;
  border:1px solid rgba(16,16,16,.12);
  background-color:#e4e0da}
.ch__x{text-align:left;white-space:nowrap}
.ch__n{font-size:13px;font-style:italic;line-height:1.15}
.ch__k{display:block;font-family:system-ui,sans-serif;font-size:8.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gris);margin-top:2px}
.choix__go{flex-shrink:0;border:1px solid currentColor;padding:14px 26px;min-height:46px;
  font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.2em;font-size:10px;
  transition:background .45s var(--e),color .45s,letter-spacing .5s var(--e)}
.choix__go:hover{background:var(--encre);color:var(--papier2);letter-spacing:.26em}
@media(max-width:1000px){.choix{flex-wrap:wrap;min-height:0}.choix__k{width:100%}}
/* sur un téléphone, le bouton prenait la moitié de la rangée et
   coupait la première peau en deux : il passe à la ligne */
@media(max-width:560px){.choix__go{width:100%;margin-top:8px}}

/* ── LE ZOOM MATIÈRE, plein cadre ── */
.plg{position:fixed;inset:0;z-index:90;background:var(--nuit);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .6s var(--e),visibility .6s;display:flex;flex-direction:column}
.plg.on{opacity:1;visibility:visible;pointer-events:auto}
.plg__i{position:relative;flex:1;min-height:0;overflow:hidden}
.plg__i img{width:100%;height:100%;object-fit:cover;transform:scale(1.1);
  transition:transform 6s var(--e)}
.plg.on .plg__i img{transform:none}
.plg__x{position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:clamp(20px,5vh,52px) clamp(20px,4vw,64px);
  background:linear-gradient(to top,rgba(10,10,10,.9) 0%,rgba(10,10,10,.62) 52%,transparent 100%);
  display:flex;flex-direction:column;gap:9px}
.plg__t{font-size:clamp(24px,3.4vw,48px);letter-spacing:-.025em;line-height:1.1;color:#fff}
.plg__t em{font-style:italic}
.plg__d{font-family:system-ui,sans-serif;font-size:12.5px;line-height:1.9;
  color:rgba(255,255,255,.88);max-width:52ch}
.plg__f{position:absolute;right:clamp(16px,2.6vw,34px);top:clamp(16px,2.6vh,30px);z-index:3;
  font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.2em;font-size:9px;
  display:flex;align-items:center;gap:10px;color:#fff;
  background:rgba(10,10,10,.55);backdrop-filter:blur(8px);padding:11px 16px;
  transition:background .35s var(--e)}
.plg__f:hover{background:rgba(10,10,10,.8)}
.plg__f:hover{opacity:1}

/* ── LA NOTE ── */
.note{position:fixed;left:clamp(14px,2.6vw,32px);top:calc(var(--ent) + 12px);z-index:60;
  font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.14em;
  color:rgba(242,239,233,.26);max-width:30ch;line-height:1.6}
/* elle ne s'affiche QUE sur le carrousel : dans le configurateur, la
   colonne de gauche est déjà occupée */
@media(max-width:1500px){.note{display:none}}
@media(max-width:1000px){.note{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="fond" id="fond"></div>

<header class="ent">
  <nav class="ent__n">
    <button class="lien on" id="versCar">Les modèles</button>
    <button class="lien" id="versPiece">La pièce</button>
  </nav>
  <span class="ent__logo">Tiraboschi <small>Paris · 1904</small></span>
  <nav class="ent__n ent__n--d">
    <button class="lien" id="versRdv">Prendre rendez-vous</button>
  </nav>
</header>

<!-- ══════════ LE CARROUSEL DES MODÈLES ══════════ -->
<section class="scene on" id="sCar">
  <div class="car" id="car">
    <div class="car__s" id="carS">
      <button class="car__f car__f--p" id="carP" aria-label="Modèle précédent"><svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg></button>
      <button class="car__f car__f--n" id="carN" aria-label="Modèle suivant"><svg viewBox="0 0 24 24"><polyline points="9,18 15,12 9,6"/></svg></button>
    </div>
    <div class="car__x">
      <h1 class="car__n" id="carN2"></h1>
      <p class="car__k cap" id="carK"></p>
      <button class="car__go" id="carGo">Prendre la pièce en main</button>
    </div>
    <div class="car__j"><i id="carJ"></i></div>
    <p class="car__c" id="carC"></p>
  </div>
</section>

<!-- ══════════ LA PIÈCE QUI TOURNE ══════════ -->
<section class="scene" id="sPiece">
  <div class="piece">
    <div class="dit">
      <p class="dit__k cap" id="ditK"></p>
      <h2 class="dit__t" id="ditT"></h2>
      <p class="dit__d" id="ditD"></p>
      <figure class="dit__z" id="ditZ">
        <figcaption class="dit__zl" id="ditZl"></figcaption>
      </figure>
    </div>

    <div class="tour" id="tour" tabindex="0" role="img" aria-label="La pièce, à faire tourner">
      <div class="tour__c" id="tourC"><div class="tour__im" id="tourIm">
        <div class="tour__o" id="tourO"></div>
      </div></div>
      <p class="tour__s" id="tourS">
        <svg viewBox="0 0 40 20" aria-hidden="true"><path d="M4 10 H34 M28 5 L34 10 L28 15"/></svg>
        Prenez la pièce et faites-la tourner
      </p>
      <button class="tour__r" id="tourR">Voir la pièce entière</button>
      <div class="tour__ch" id="tourCh"><i id="tourChB"></i></div>
      <div class="rot">
        <span class="rot__l" id="rotL">0°</span>

    <div class="choix__l" id="choixL"></div>

</section>

<!-- ══════════ LE ZOOM MATIÈRE ══════════ -->
<div class="plg" id="plg" role="dialog" aria-modal="true" aria-labelledby="plgT">
  <div class="plg__i" id="plgI">
    <button class="plg__f" id="plgX">Fermer <span aria-hidden="true">✕</span></button>
    <div class="plg__x">
      <p class="cap" style="opacity:.75;color:#fff">La matière, de tout près</p>

<script>
const TOURS = "__TOURS__";
const $ = i => document.getElementById(i);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ═══════════════════════════════════════════════════════════════
   LES PIÈCES
   Chaque peau est un TOUR COMPLET, avec son propre nombre de vues
   (39, 33, 29, 22, 15) : le studio n'a pas tourné du même pas. On
   repère donc l'angle par une FRACTION du tour, jamais par un
   numéro de vue — sinon changer de peau ferait sauter la pièce.
   ═══════════════════════════════════════════════════════════════ */
const PIECES = [
  { id:'colette', n:'Colette', k:'Le V taillé dans la masse',
    d:"La signature de la maison, poussée à son extrême : un V taillé dans la masse qui ouvre le sac sans fermoir. Sa tenue ne doit rien à une armature — seulement à l'épaisseur du cuir et à la façon dont la peau a été placée sur le gabarit.",
    peaux:[
      { id:'colette-rouge',    n:'Rouge Carmin', m:'Alligator',   amb:'#5e1a20' },
      { id:'colette-bordeaux', n:'Bordeaux',     m:'Alligator',   amb:'#3a1f24' },
      { id:'colette-cognac',   n:'Cognac',       m:'Veau lisse',  amb:'#5a3620' },
    ] },
  { id:'olympe', n:'Olympe', k:'Le seau · cordon de cuir',
    d:"Un seau que le cordon referme d'un geste. La doublure de toile écrue se retourne sur le cuir : c'est la seule couture visible de la pièce, et elle se voit exprès.",
    peaux:[ { id:'olympe-camel', n:'Camel', m:'Veau grainé', amb:'#4a3122' } ] },
];

/* Les éléments que l'on personnalise. Chacun sait à QUEL ANGLE la
   pièce se montre le mieux — désigner un élément fait tourner la
   pièce jusqu'à lui, plutôt que de poser un repère par-dessus. */
/* `p` : la position du point SUR la pièce, en fraction de la vue
   (x, y depuis le coin haut-gauche). `arc` : la plage d'angles où
   l'élément se voit — hors de cette plage, le point s'efface plutôt
   que de désigner une face cachée. */
/* `p` VAUT POUR UN CADRE, et chaque tour a le sien : le cadre de
   l'Olympe fait 1400 × 2199 quand celui de la Colette en fait
   1400 × 1453. Les mêmes fractions y désignent autre chose — le
   repère du « V » tombait sur la bandoulière. D'où `pPar`. */
const ELEMENTS = [
  { id:'peau', n:'La peau', a:0, p:[.5, .62], arc:[0, 1], zone:0.34,
    pPar:{ 'olympe':[.5, .80] },
    t:'La <em>peau</em>',
    d:"Quatre peausseries, une seule règle : pleine fleur, jamais corrigée. L'alligator vient d'élevages certifiés CITES ; le veau lisse de la tannerie Rémy Carriat, en Normandie. Sur cent peaux reçues, une dizaine entre à l'atelier.",
    zl:"L'écaille, de tout près",
    zlPar:{ 'olympe':'Le grain du veau, de tout près',
            'colette/Veau lisse':'Le veau lisse, de tout près' },
    icone:'<path d="M3 6 h18 v12 h-18 z"/><path d="M3 12 h18 M9 6 v12 M15 6 v12"/>' },
  { id:'v', n:'Le V', a:0, p:[.5, .50], arc:[.82, .18], zone:0.36,
    pPar:{ 'olympe':[.22, .62] },
    t:'Le <em>V</em>',
    d:"Il se taille dans la masse, d'un seul geste, sans repentir : un tranchet qui hésite laisse une trace que la tranche gardera. La pointe tombe au millimètre — elle se décide à la coupe, elle ne se rattrape pas au montage.",
    /* l'Olympe n'a pas de V : elle a un cordon. Montrer une photo de
       cordon sous un titre « Le V » trahit le montage aussi sûrement
       qu'une écaille sous un veau grainé. */
    nPar:{ 'olympe':'Le cordon' },
    tPar:{ 'olympe':'Le <em>cordon</em>' },
    dPar:{ 'olympe':"Un cordon de cuir referme le seau d'un geste, sans fermoir ni aimant : la tension du cuir suffit à le tenir. Il coulisse dans deux passants sertis de laiton, et se termine par deux embouts tournés dans la masse." },
    zl:'Le V, taillé dans la masse',
    zlPar:{ 'olympe':'Le cordon et son embout' },
    icone:'<path d="M4 6 L12 17 L20 6"/>' },
  { id:'anse', n:"L'anse", a:.08, p:[.5, .09], arc:[0, 1], zone:0.24,
    pPar:{ 'olympe':[.5, .12] },
    t:"L'<em>anse</em>",
    d:"Une seule anse, en tête de cuir, montée sur deux attaches de laiton massif. Elle est posée en dernier, quand la pièce est déjà montée : elle ne se recentre plus.",
    zl:"L'attache, sertie à la main",
    icone:'<path d="M7 20 v-9 a5 5 0 0 1 10 0 v9"/>' },
  { id:'tranche', n:'La tranche', a:.25, p:[.78, .62], arc:[.12, .42], zone:0.2,
    pPar:{ 'olympe':[.80, .84] },
    t:'La <em>tranche</em>',
    d:"Teinte puis polie à chaud, en trois passes. C'est le détail qui trahit une pièce faite vite : une tranche mal fermée boit l'eau et s'ouvre en deux hivers.",
    zl:'La tranche, teinte et polie',
    icone:'<path d="M4 9 h16 v6 h-16 z"/><path d="M4 12 h16"/>' },
  { id:'fond', n:'Le fond', a:.32, p:[.5, .93], arc:[0, 1], zone:0.26,
    pPar:{ 'olympe':[.5, .96] },
    t:'Le <em>fond</em>',
    d:"Structuré, il tient la pièce debout sans armature. Le devant se coupe dans le croupon, la partie la plus dense de la peau ; le ventre, plus tendre, ne va jamais aux angles.",
    zl:'Le fond et son embase',
    icone:'<path d="M5 7 L19 7 L17 17 L7 17 Z"/>' },
  { id:'doublure', n:'La doublure', a:.10, p:[.40, .44], arc:[.86, .22], zone:0.28,
    pPar:{ 'olympe':[.5, .58] },
    t:'La <em>doublure</em>',
    d:"Agneau des Gants de Millau, en Aveyron : une douceur qui tombe comme de la soie tendue. Sur l'Olympe, une toile écrue se retourne sur le cuir — la seule couture visible de la pièce.",
    zl:"L'intérieur, doublé",
    icone:'<path d="M4 5 h16 v14 h-16 z"/><path d="M8 5 v14"/>' },
  { id:'ferrure', n:'Les ferrures', a:.13, p:[.28, .44], arc:[.86, .40], zone:0.15,
    pPar:{ 'olympe':[.66, .55] },
    t:'Les <em>ferrures</em>',
    d:"Laiton massif, finition satinée, pour l'éternité. Serties à la main, à l'œil et au toucher — jamais à la machine. Une ferrure fondue est parfaite et muette ; une ferrure sertie garde la trace de l'heure qu'on lui a donnée.",
    zl:'Le laiton, serti à la main',
    icone:'<circle cx="12" cy="12" r="5"/><path d="M12 3 v4 M12 17 v4"/>' },
];

/* la macro de CETTE peau pour CET élément ; à défaut, celle du même
   élément sur une autre peau — mieux vaut la bonne pièce dans une
   autre couleur qu'une image absente */
function macro(peau, el) {
  const k = 'm-' + peau + '-' + el;
  if (TOURS[k]) return k;
  for (const P of PIECES) for (const K of P.peaux) {
    const a = 'm-' + K.id + '-' + el;
    if (TOURS[a]) return a;
  }
  return '';
}

/* ═══════════ L'AMBIANCE ═══════════ */
/* Les pièces étant détourées, il n'y a plus de toile à raccorder :
   l'ambiance ne fait plus qu'éclairer la salle à la teinte du cuir. */
function ambiance(c) { document.documentElement.style.setProperty('--ambiance', c); }

/* ═══════════════════════════════════════════════════════════════
   LE TOUR — une séquence d'images, pas une scène 3D
   On PRÉCHARGE la séquence entière avant d'autoriser le geste :
   une rotation qui décode ses images en route saute, et le saut se
   voit plus qu'il ne se pardonne.
   ═══════════════════════════════════════════════════════════════ */
const cache = {};
/* les ombres, une par vue : légères (520 px, gris sur alpha) */
const ombres = {};
function prechargerOmbres(cle) {
  if (ombres[cle]) return;
  ombres[cle] = (TOURS[cle + '-o'] || []).map(s => {
    const im = new Image(); im.alt = ''; im.decoding = 'async';
    im.draggable = false; im.src = s;
    return im;
  });
}
function precharger(cle, surAvance) {
  prechargerOmbres(cle);
  if (cache[cle]) return Promise.resolve(cache[cle]);
  const src = TOURS[cle] || [];
  let faits = 0;
  /* ON DÉCODE AVANT DE RENDRE LA MAIN. `onload` dit que l'octet est
     là, pas que l'image est prête à peindre : la première rotation
     décodait ses vues en route, et cela se sentait. */
  return Promise.all(src.map(s => new Promise(ok => {
    const im = new Image();
    im.draggable = false;
    const fini = () => { faits++; if (surAvance) surAvance(faits / src.length); ok(im); };
    im.onload = () => { (im.decode ? im.decode() : Promise.resolve()).then(fini, fini); };
    im.onerror = fini;
    im.src = s;
  }))).then(ims => (cache[cle] = ims));
}

let pieceIdx = 0, peauIdx = 0, fraction = 0, elemIdx = 0;
let vues = [], posee = null, natW = 0, natH = 0, cleVue = '', enCharge = false;

/* ═══════════ LE CADRE DE LA PIÈCE ═══════════
   On pose la boîte EN PIXELS, au format exact de la prise de vue. La
   feuille de style ne sait pas le faire : une image en `width:100%`
   bornée par un `max-height` en pourcentage, dans un parent de hauteur
   automatique, s'étire dans le sens de la contrainte. C'est ce qui
   aplatissait l'anse et sortait le bas du sac du cadre.
   Et l'on N'AGRANDIT JAMAIS une vue au-delà de sa définition. */
function ajuster(boite, dispo, marge) {
  if (!natW || !natH || !dispo.width || !dispo.height) return null;
  const rap = natW / natH;
  let w = dispo.width * (marge || 1), h = w / rap;
  if (h > dispo.height * (marge || 1)) { h = dispo.height * (marge || 1); w = h * rap; }
  if (w > natW) { w = natW; h = natH; }
  boite.style.width = Math.round(w) + 'px';
  boite.style.height = Math.round(h) + 'px';
  return { w: w, h: h };
}
function cadrer() {
  ajuster($('tourIm'), $('tourC').getBoundingClientRect());
  cadrerCar();
  if (zoomEl !== null) approcher(zoomEl);
  else { borner(); appliquer(false); }
}
addEventListener('resize', cadrer);
/* LA SCÈNE SE MESURE QUAND ELLE EST POSÉE, pas avant. Sur téléphone,
   le cartel au-dessus repousse la scène après le premier calcul : la
   boîte gardait la hauteur d'avant et la pièce se faisait couper en
   haut par la lucarne. Un observateur de taille suit la mise en page
   au lieu de la deviner. */
if (window.ResizeObserver) {
  let attendu = false;
  new ResizeObserver(() => {
    if (attendu) return;
    attendu = true;
    requestAnimationFrame(() => { attendu = false; cadrer(); });
  }).observe($('tourC'));
  new ResizeObserver(() => {
    if (attendu) return;
    attendu = true;
    requestAnimationFrame(() => { attendu = false; cadrerCar(); majCar(); });
  }).observe($('carS'));
}

/* ═══════════ LA PRÉSENTATION : APPROCHE, DÉPLACEMENT, ÉCHELLE ═══════════
   UNE SEULE transformation décrit comment la pièce est présentée —
   déplacée, agrandie. Trois fonctions y écrivaient chacune la leur ;
   il suffirait de prendre la pièce en main après s'être approché d'un
   détail pour que l'une efface l'autre. Tout passe par `vueT`.

   L'ORIGINE EST TOUJOURS LE CENTRE DE LA BOÎTE. Un `transform-origin`
   qui se déplace rend impossible de composer un déplacement avec un
   agrandissement : le même `translate` ne veut plus dire la même chose
   d'un appel à l'autre. Avec une origine fixe, amener un point q au
   centre s'écrit d'une ligne — `T = −(q − ½) · taille · k`. */
let zoomEl = null, zoomCle = '', approcheK = 1;
const vueT = { x: 0, y: 0, k: 1 };

function appliquer(anime) {
  const b = $('tourIm');
  b.style.transition = anime ? 'transform .8s var(--e)' : 'transform 0s';
  b.style.transform = 'translate(' + vueT.x.toFixed(1) + 'px,' + vueT.y.toFixed(1)
    + 'px) scale(' + vueT.k.toFixed(4) + ')';
  b.style.setProperty('--z', (1 / vueT.k).toFixed(4));
  approcheK = vueT.k;
  $('tour').classList.toggle('pres',
    vueT.k > 1.02 || Math.abs(vueT.x) > 3 || Math.abs(vueT.y) > 3);
}

/* on ne perd pas la pièce hors du cadre : elle reste à portée de main */
function borner() {
  const b = $('tourIm'), r = $('tourC').getBoundingClientRect();
  const bw = parseFloat(b.style.width) || 0, bh = parseFloat(b.style.height) || 0;
  /* on en garde toujours la moitié sous les yeux : « comme on veut »
     ne veut pas dire « jusqu'à la perdre » */
  const mx = Math.max(0, (bw * vueT.k + r.width) / 2
                        - Math.min(bw * vueT.k, r.width) * .5);
  const my = Math.max(0, (bh * vueT.k + r.height) / 2
                        - Math.min(bh * vueT.k, r.height) * .5);
  vueT.x = Math.max(-mx, Math.min(mx, vueT.x));
  vueT.y = Math.max(-my, Math.min(my, vueT.y));
}
/* l'agrandissement se plafonne à la définition de la prise de vue :
   au-delà on montre du flou, et c'est le reproche qui a ouvert ce
   chantier. Pour aller plus près, il y a la macro. */
function kMax() {
  const bw = parseFloat($('tourIm').style.width) || 1;
  return Math.max(1.4, natW / bw * 1.15);
}

/* ── SE RAPPROCHER D'UN ÉLÉMENT ── */
function approcher(i) {
  const el = ELEMENTS[i], b = $('tourIm'), c = $('tourC');
  if (!el || !el.p || !b.style.width) return;
  const q = surCadre(posDe(el));
  const bw = parseFloat(b.style.width), bh = parseFloat(b.style.height);
  const r = c.getBoundingClientRect();
  if (!bw || !bh || !r.width) return;
  const zone = el.zone || .3;
  let k = (.72 * Math.min(r.width, r.height)) / (zone * Math.min(bw, bh));
  vueT.k = Math.max(1.3, Math.min(k, kMax()));
  vueT.x = -(q[0] - .5) * bw * vueT.k;
  vueT.y = -(q[1] - .5) * bh * vueT.k;
  borner(); appliquer(true);
  zoomEl = i;
}
function reculer() {
  vueT.x = vueT.y = 0; vueT.k = 1;
  appliquer(true);
  zoomEl = null;
}
$('tourR').onclick = reculer;

/* ═══════════ LA VUE : DEUX CALQUES, UN FONDU ═══════════
   Une séquence de 15 à 39 vues, c'est un pas de 9 à 24 degrés : d'une
   vue à l'autre, la pièce SAUTE. On garde donc DEUX calques et l'on
   fond de l'un à l'autre selon la position CONTINUE dans le tour. Le
   mouvement redevient fluide sans qu'on invente rien — on ne fabrique
   aucune vue, on superpose deux vraies prises.

   ET L'ON SE CALE À L'ARRÊT. Un fondu figé à mi-chemin, c'est un
   fantôme : dès que le geste cesse, la pièce rejoint la vue la plus
   proche en 180 ms, comme un plateau qui trouve son cran. */
let calage = null;
/* ═══════════ LE RENDU SUIT L'ÉCRAN, PAS LA SOURIS ═══════════
   `poser()` était appelé depuis `pointermove`. Or une souris rapporte
   à 60–125 Hz, un pavé tactile bien moins, et l'écran rafraîchit à 60
   ou 120 : mesuré sur un geste à vitesse constante, LA MOITIÉ DES
   IMAGES NE BOUGEAIENT PAS, et le pas variait de ±25 % d'une image à
   l'autre. C'est ce qui se sent comme un accroc.

   Le geste ne fait donc plus que POSER UNE CIBLE ; une boucle liée à
   l'écran la rejoint, un peu à chaque image. Toutes les images
   bougent, du même pas — et la pièce y gagne un poids, celui d'un
   objet qu'on lance et qui suit. */
let cibleF = 0, suit = null, enPrise = false;
function suivre() {
  const d = ((cibleF - fraction) % 1 + 1.5) % 1 - .5;
  if (Math.abs(d) < 2e-5 && !enPrise) { suit = null; poser(cibleF); return; }
  poser(fraction + d * .34);
  suit = requestAnimationFrame(suivre);
}
function relancerSuivi() { if (suit === null) suit = requestAnimationFrame(suivre); }
function arreterSuivi() { cancelAnimationFrame(suit); suit = null; }
function vueDe(k) { return vues[((k % vues.length) + vues.length) % vues.length]; }
function calerVue(im, i) {
  /* le calage d'axe, vue par vue (voir `cal` dans tours.json) */
  const c9 = ((TOURS.__tours__ || {})[cleVue] || {}).cal;
  const q9 = c9 && c9[i];
  im.style.transform = q9 ? 'translate(' + (q9[0] * 100).toFixed(3) + '%,'
                                         + (q9[1] * 100).toFixed(3) + '%)' : '';
}
function poser(fr) {
  fraction = ((fr % 1) + 1) % 1;
  if (!vues.length) return;
  const n = vues.length, c = $('tourIm');
  const pos = fraction * n;
  let i = Math.floor(pos) % n, j = (i + 1) % n;
  const brut = pos - Math.floor(pos);
  /* LE FONDU DÉPEND DU PAS ANGULAIRE, et c'est mesuré : à 9° (39 vues)
     deux vues voisines se ressemblent assez pour se fondre, et le
     mouvement devient continu. À 24° — le pas de l'Olympe — elles ne
     se ressemblent plus du tout : un fondu à mi-chemin y montre DEUX
     sacs, deux anses, deux bandoulières. On resserre donc la
     dissolution à mesure que le pas s'élargit ; au-delà de 20° elle
     n'est plus qu'une coupe. */
  const pas = 360 / n;
  const melange = Math.max(0, Math.min(1, (20 - pas) / 8));
  let t = Math.min(1, Math.max(0, (brut - .5) / Math.max(.06, melange) + .5));
  /* au-delà de 20° de pas, plus de fondu du tout : à mi-chemin il
     montrerait deux sacs entiers */
  const fondu = n > 1 && melange > .02 && t > .02 && t < .98;
  if (!fondu) { if (t >= .5) i = j; t = 0; }
  const av = vueDe(i), ap = fondu ? vueDe(j) : null;

  /* ON CHANGE DE SÉQUENCE : retirer les vues de la précédente. Toutes
     sont en `position:absolute;inset:0` — laissées là, elles
     s'empilent, et c'est l'ANCIENNE qui reste au-dessus. */
  [...c.children].forEach(v => {
    if (v.tagName === 'IMG' && v !== av && v !== ap) v.remove();
  });
  if (av.parentNode !== c) c.insertBefore(av, c.firstChild);
  av.alt = PIECES[pieceIdx].n;
  av.style.opacity = fondu ? (1 - t).toFixed(3) : '1';
  calerVue(av, i);
  if (ap) {
    if (ap.parentNode !== c) c.insertBefore(ap, av.nextSibling);
    else if (ap.previousSibling !== av) c.insertBefore(ap, av.nextSibling);
    ap.alt = ''; ap.style.opacity = t.toFixed(3);
    calerVue(ap, j);
  }
  posee = av;

  /* l'ombre, fichier à part : elle suit la vue dominante */
  const dom = t < .5 ? i : j;
  const so = (ombres[cleVue] || [])[dom];
  if (so) {
    const o = $('tourO');
    if (o.firstChild !== so) {
      if (o.firstChild) o.replaceChild(so, o.firstChild); else o.appendChild(so);
    }
    calerVue(so, dom);
  }
  $('rotT').style.left = (fraction * 100).toFixed(2) + '%';
  $('rotL').textContent = Math.round(fraction * 360) + '°';
  if (typeof majPoints === 'function') { majPos(); majPoints(); }
}
/* rejoindre la vue la plus proche — le cran du plateau */
function caler() {
  cancelAnimationFrame(calage); arreterSuivi();
  if (!vues.length) return;
  const n = vues.length, d0 = fraction;
  const cible = Math.round(fraction * n) / n;
  cibleF = cible;
  let delta = ((cible - d0) % 1 + 1.5) % 1 - .5;
  if (RM || Math.abs(delta) < 1e-4) { poser(cible); return; }
  const t0 = performance.now();
  calage = requestAnimationFrame(function pas(t) {
    const p = Math.min(1, (t - t0) / 180);
    poser(d0 + delta * (1 - Math.pow(1 - p, 3)));
    if (p < 1) calage = requestAnimationFrame(pas);
  });
}

/* changer de peau GARDE L'ANGLE : c'est tout l'intérêt d'un tour
   photographié — on compare deux cuirs sous le même jour. */
function habiller(pi, pe, garderAngle) {
  pieceIdx = pi; peauIdx = pe;
  const P = PIECES[pi], K = P.peaux[pe];
  cleVue = K.id;
  ambiance(K.amb);
  const ch = $('tourCh'), chb = $('tourChB');
  ch.classList.add('on'); chb.style.width = '0%';
  /* changer de peau garde aussi LE RAPPROCHEMENT : comparer deux cuirs
     de tout près est exactement ce à quoi sert un tour photographié */
  const presAvant = garderAngle ? zoomEl : null;
  posee = null; enCharge = true;
  return precharger(K.id, p => { chb.style.width = (p * 100).toFixed(0) + '%'; })
    .then(ims => {
      vues = ims; enCharge = false;
      ch.classList.remove('on');
      /* LE FORMAT VIENT DE LA PRISE DE VUE, pas d'une valeur écrite en
         dur : chaque tour a son propre cadrage, calculé sur l'union des
         silhouettes. */
      const n = ims.find(im => im.naturalWidth);
      if (n) { natW = n.naturalWidth; natH = n.naturalHeight; }
      reculer();
      if (enMain) modeMain(false);
      cadrer();
      poser(garderAngle ? fraction : 0);
      majChoix(); majDit(); majRail(); majPos();
      if (presAvant !== null) approcher(presAvant);
    });
}

/* ═══════════════════════════════════════════════════════════════
   LE GESTE — DEUX FAÇONS DE TENIR LA PIÈCE

   « Une option de prise en main du sac afin de le saisir et de le
   déplacer comme on veut. »

   · LA FAIRE TOURNER (par défaut) : on la prend et on la fait pivoter.
   · LA PRENDRE EN MAIN : on la saisit et on la porte où l'on veut,
     on l'approche, on l'éloigne. La rotation reste accessible au rail
     d'angle, aux flèches et au balayage horizontal.

   Dans les deux modes : la molette verticale (ou le pincement à deux
   doigts) approche et éloigne ; le balayage HORIZONTAL fait tourner ;
   un double-clic repose la pièce.
   ═══════════════════════════════════════════════════════════════ */
let enMain = false;
function modeMain(v) {
  enMain = v;
  $('tour').classList.toggle('main', enMain);
  const b = $('tourMain');
  b.textContent = enMain ? 'Reposer la pièce' : 'Prendre la pièce en main';
  b.setAttribute('aria-pressed', enMain ? 'true' : 'false');
  $('tour').classList.add('deja');
}
$('tourMain').onclick = () => modeMain(!enMain);

(function () {
  const t = $('tour');
  /* on suit TOUS les doigts posés : c'est ce qui permet le pincement,
     et sur une tablette de boutique c'est le geste qu'on essaie
     d'abord */
  const doigts = new Map();
  let f0 = 0, x0 = 0, y0 = 0, tx0 = 0, ty0 = 0, k0 = 1;
  let vitesse = 0, dernier = 0, dernierT = 0, elan = null, pince = 0;
  const largeur = () => Math.max(240, t.getBoundingClientRect().width);
  function arreter() { cancelAnimationFrame(elan); elan = null; cancelAnimationFrame(calage); }
  const centre = () => {
    let sx = 0, sy = 0;
    doigts.forEach(d => { sx += d.x; sy += d.y; });
    return { x: sx / doigts.size, y: sy / doigts.size };
  };
  const ecart = () => {
    const v = [...doigts.values()];
    return v.length < 2 ? 0 : Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y);
  };
  function repartir() {
    const c = centre();
    x0 = c.x; y0 = c.y; f0 = fraction;
    tx0 = vueT.x; ty0 = vueT.y; k0 = vueT.k;
    pince = ecart();
  }

  /* UN REPÈRE EST AUSSI UNE PRISE. On l'excluait du geste pour que son
     clic passe — mais sept repères sur la pièce, ce sont sept endroits
     où la saisir ne fait rien. On prend donc la pièce PARTOUT, et l'on
     décide à la levée : sans mouvement c'est un clic, avec mouvement
     c'est une rotation. */
  let cibleP = null, bouge = false, dernierRep = 0;
  t.addEventListener('pointerdown', e => {
    /* les boutons de la scène gardent leur clic */
    if (e.target.closest('.tour__r, .tour__m')) return;
    cibleP = e.target.closest('.pt'); bouge = false;
    enPrise = true; cibleF = fraction;
    arreter();
    doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    repartir();
    vitesse = 0; dernier = e.clientX; dernierT = performance.now();
    t.classList.add('tire');
    t.setPointerCapture(e.pointerId);
  });

  t.addEventListener('pointermove', e => {
    if (!doigts.has(e.pointerId)) return;
    doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const c = centre();
    if (Math.abs(c.x - x0) > 4 || Math.abs(c.y - y0) > 4) { bouge = true; t.classList.add('deja'); }

    if (doigts.size >= 2) {
      /* PINCEMENT : on approche, et la pièce suit les deux doigts */
      const d = ecart();
      if (pince > 8 && d > 8) vueT.k = Math.max(1, Math.min(kMax(), k0 * d / pince));
      vueT.x = tx0 + (c.x - x0); vueT.y = ty0 + (c.y - y0);
      borner(); appliquer(false);
      return;
    }
    if (enMain) {
      /* ON PORTE LA PIÈCE : elle va exactement où va le doigt */
      vueT.x = tx0 + (c.x - x0); vueT.y = ty0 + (c.y - y0);
      borner(); appliquer(false);
      return;
    }
    /* ON LA FAIT TOURNER. Une largeur de scène = un tour et demi :
       assez pour faire le tour d'un geste, sans qu'elle s'emballe.
       On ne pose qu'une CIBLE : c'est l'écran qui la rejoint. */
    cibleF = f0 + (c.x - x0) / (largeur() * 1.5);
    relancerSuivi();
    /* LA VITESSE SE LISSE ET SE MESURE PAR SECONDE. Prise sur une seule
       image, elle dépend de la cadence d'affichage : l'élan partait en
       trombe ou pas du tout selon la machine. */
    const now = performance.now();
    const dt = Math.max(8, now - dernierT);
    vitesse = vitesse * .6 + ((e.clientX - dernier) / dt * 16.7) * .4;
    dernier = e.clientX; dernierT = now;
  });

  function fin(e) {
    if (!doigts.has(e.pointerId)) return;
    doigts.delete(e.pointerId);
    try { t.releasePointerCapture(e.pointerId); } catch (x) {}
    if (doigts.size) { repartir(); return; }
    enPrise = false;
    t.classList.remove('tire');
    /* sans mouvement, c'était un clic sur le repère */
    if (cibleP && !bouge) {
      const rep = cibleP; cibleP = null;
      const now = performance.now();
      if (now - dernierRep > 320) { dernierRep = now; rep.click(); }
      return;
    }
    cibleP = null;
    if (zoomEl !== null && !enMain) {
      setTimeout(() => { if (zoomEl !== null) approcher(zoomEl); }, 60);
    }
    if (enMain) return;
    if (RM || Math.abs(vitesse) < 1.2) { caler(); return; }
    /* L'ÉLAN, puis LE CRAN. La pièce continue, ralentit, et se pose sur
       la vue la plus proche — sinon elle s'arrête sur un fondu, et un
       fondu figé est un fantôme. */
    let v = vitesse / (largeur() * 1.5);
    relancerSuivi();
    elan = requestAnimationFrame(function suite() {
      v *= .935;
      if (Math.abs(v) < .00025) { caler(); return; }
      /* l'élan pousse LA CIBLE ; la boucle de suivi fait le reste, et
         le mouvement garde exactement la même texture qu'au doigt */
      cibleF += v; relancerSuivi();
      elan = requestAnimationFrame(suite);
    });
  }
  t.addEventListener('pointerup', fin);
  t.addEventListener('pointercancel', fin);
  /* la ceinture avec les bretelles : `-webkit-user-drag` ne suffit pas
     partout, et un `dragstart` qui passe casse la prise */
  t.addEventListener('dragstart', e => e.preventDefault());

  /* LA MOLETTE : le balayage HORIZONTAL fait tourner, le VERTICAL
     approche. C'est la répartition qu'un pavé tactile impose de
     lui-même — deux doigts de côté pour tourner un objet, deux doigts
     vers le haut pour s'en approcher. */
  let repos = null;
  t.addEventListener('wheel', e => {
    e.preventDefault(); arreter(); t.classList.add('deja');
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
      cibleF += e.deltaX / (largeur() * 1.5); relancerSuivi();
      clearTimeout(repos); repos = setTimeout(caler, 200);
      return;
    }
    if (!e.deltaY) return;
    const r = $('tourC').getBoundingClientRect();
    const av = vueT.k;
    vueT.k = Math.max(1, Math.min(kMax(), vueT.k * Math.exp(-e.deltaY / 420)));
    /* on approche AUTOUR DU CURSEUR : le détail qu'on vise ne fuit pas */
    const sx = e.clientX - (r.left + r.width / 2) - vueT.x;
    const sy = e.clientY - (r.top + r.height / 2) - vueT.y;
    vueT.x -= sx * (vueT.k / av - 1);
    vueT.y -= sy * (vueT.k / av - 1);
    if (vueT.k <= 1.001) { vueT.x = vueT.y = 0; zoomEl = null; }
    borner(); appliquer(false);
  }, { passive: false });

  /* un double-clic repose la pièce — le geste d'annulation attendu */
  t.addEventListener('dblclick', e => {
    if (e.target.closest('.pt, .tour__r, .tour__m')) return;
    reculer();
  });

  t.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault(); t.classList.add('deja');
    cibleF = fraction + (e.key === 'ArrowRight' ? 1 : -1) / Math.max(8, vues.length);
    relancerSuivi();
  });

  /* le rail d'angle — il tourne la pièce quel que soit le mode */
  const p = $('rotP');
  const glisserRail = e => {
    const r = p.getBoundingClientRect();
    t.classList.add('deja');
    cibleF = (e.clientX - r.left) / r.width; relancerSuivi();
  };
  p.addEventListener('pointerdown', e => { p.setPointerCapture(e.pointerId); glisserRail(e); });
  p.addEventListener('pointermove', e => { if (e.buttons) glisserRail(e); });
  p.addEventListener('pointerup', caler);
})();

/* tourner DOUCEMENT jusqu'à un angle : c'est la pièce qui se
   présente, on ne saute pas d'un côté à l'autre */
let tourneAuto = false;
function versAngle(cible) {
  arreterSuivi(); cibleF = cible;
  if (RM) { poser(cible); return; }
  const d0 = fraction;
  tourneAuto = true;
  setTimeout(() => { tourneAuto = false; }, 760);
  let delta = ((cible - d0) % 1 + 1.5) % 1 - .5;   /* le chemin le plus court */
  const t0 = performance.now(), duree = 700;
  (function pas(t) {
    const p = Math.min(1, (t - t0) / duree);
    const e = 1 - Math.pow(1 - p, 3);
    poser(d0 + delta * e);
    if (p < 1) requestAnimationFrame(pas);
    else {
      caler();
      /* ON RECADRE UNE FOIS LA PIÈCE ARRIVÉE. Le rapprochement se
         calcule sur la boîte de la vue COURANTE : lancé avant la
         rotation, il visait l'angle qu'on quittait. */
      if (zoomEl !== null) approcher(zoomEl);
    }
  })(t0);
}

/* ═══════════ LES POINTS SUR LA PIÈCE ═══════════
   Désigner un élément SUR l'objet, et pas seulement dans un rail :
   c'est le geste qu'on attend d'un configurateur. Un point ne
   s'affiche qu'aux angles où son élément se voit — inutile de montrer
   la tranche quand on regarde la pièce de face. */
const POINTS = [];
ELEMENTS.forEach((el, i) => {
  if (!el.p) return;
  const b = document.createElement('button');
  b.className = 'pt'; b.dataset.pt = el.id;
  b.style.left = (el.p[0] * 100) + '%';
  b.style.top = (el.p[1] * 100) + '%';
  b.innerHTML = '<span class="pt__n">' + esc(el.n) + '</span>';
  b.setAttribute('aria-label', el.n);
  /* UN CLIC RAPPROCHE ; UN SECOND CLIC, SUR LE MÊME POINT, OUVRE LA
     MACRO. Le rapprochement s'arrête à la définition de la prise de
     vue ; pour aller plus près, c'est une autre photographie qu'il
     faut, pas un agrandissement. */
  b.onclick = () => {
    if (zoomEl === i) ouvrirZoom(el, zoomCle);
    else choisirElement(i);
  };
  $('tourIm').appendChild(b);
  POINTS.push({ el, b, i });
});
/* ═══════════ OÙ SE POSE UN REPÈRE ═══════════
   `p` désigne un point DE LA PIÈCE, en fraction de sa boîte — pas du
   cadre. C'est la seule façon qu'il désigne encore quelque chose quand
   la pièce tourne : de face elle est large, de profil étroite, et un
   point fixe du cadre tombait à 200 px de la ferrure qu'il montrait.
   La boîte de chaque vue est relevée à l'export (`boite`). */
function posDe(el) {
  const P = PIECES[pieceIdx], K = P.peaux[peauIdx];
  return (el.pPar && (el.pPar[P.id + '/' + K.m] || el.pPar[P.id])) || el.p;
}
function boiteVue() {
  const t = (TOURS.__tours__ || {})[cleVue];
  const b = t && t.boite;
  if (!b || !b.length) return [0, 0, 1, 1];
  const i = Math.round(fraction * b.length) % b.length;
  return b[i] || b[0];
}
/* du repère de la pièce à celui du cadre */
function surCadre(q) {
  const b = boiteVue();
  return [b[0] + q[0] * (b[2] - b[0]), b[1] + q[1] * (b[3] - b[1])];
}
function majPos() {
  POINTS.forEach(({ el, b }) => {
    const q = surCadre(posDe(el));
    b.style.left = (q[0] * 100).toFixed(2) + '%';
    b.style.top = (q[1] * 100).toFixed(2) + '%';
  });
}
function dansArc(arc, f) {
  if (!arc) return true;
  const [a, z] = arc;
  return a <= z ? (f >= a && f <= z) : (f >= a || f <= z);
}
function majPoints() {
  POINTS.forEach(({ el, b, i }) => {
    b.classList.toggle('vu', dansArc(el.arc, fraction));
    b.classList.toggle('on', i === elemIdx);
  });
  /* ON RECULE QUAND LA PIÈCE TOURNE LE DOS À CE QU'ON REGARDAIT. On
     peut tourner autour d'un détail tant qu'il se voit ; passé son
     arc, rester au plus près montrerait une face qui ne le porte pas.
     La rotation de présentation (`versAngle`) ne compte pas : elle
     traverse forcément des angles hors de l'arc pour y arriver. */
  if (zoomEl !== null && !tourneAuto) {
    const el = ELEMENTS[zoomEl];
    if (el && el.p && !dansArc(el.arc, fraction)) reculer();
  }
}

/* ═══════════ LE RAIL DES ÉLÉMENTS ═══════════ */
ELEMENTS.forEach((el, i) => {
  const b = document.createElement('button');
  b.className = 'el' + (i === 0 ? ' on' : '');
  b.dataset.el = el.id;
  b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + el.icone + '</svg>' +
    '<span class="el__n">' + esc(el.n) + '</span>';
  b.setAttribute('aria-label', el.n);
  b.onclick = () => choisirElement(i);
  $('rail').appendChild(b);
});
function choisirElement(i) {
  elemIdx = i; majDit(); majRail(); majPoints();
  versAngle(ELEMENTS[i].a);
  if (ELEMENTS[i].p) approcher(i); else reculer();
}
function majRail() {
  const P = PIECES[pieceIdx], K = P.peaux[peauIdx];
  const nom = el => (el.nPar && (el.nPar[P.id + '/' + K.m] || el.nPar[P.id])) || el.n;
  [...$('rail').children].forEach((b, i) => {
    b.classList.toggle('on', i === elemIdx);
    const n = nom(ELEMENTS[i]);
    b.querySelector('.el__n').textContent = n;
    b.setAttribute('aria-label', n);
  });
  POINTS.forEach(({ el, b }) => { b.querySelector('.pt__n').textContent = nom(el); });
}
/* les points suivent la rotation */
const _poser = poser;
function majDit() {
  const el = ELEMENTS[elemIdx], P = PIECES[pieceIdx], K = P.peaux[peauIdx];
  /* LE ZOOM DOIT ÊTRE CELUI DU MODÈLE ACTIF. Montrer une écaille
     d'alligator rouge pendant qu'on regarde une Olympe en veau grainé
     n'apprend rien et trahit le montage. On cherche donc, dans l'ordre :
     la macro de CE modèle et de CETTE peau, puis celle de cette peau,
     puis le défaut de l'élément. */
  /* LA MÊME RÉSOLUTION POUR TOUT CE QUI SE DIT : l'image, le titre, le
     texte et la légende. Sinon on montre le cordon de l'Olympe sous le
     titre « Le V », ou une écaille d'alligator légendée pour un veau
     grainé — et le montage se voit. */
  const par = (m, def) => (m && (m[P.id + '/' + K.m] || m[P.id])) || def;
  /* UNE MACRO PAR PEAU ET PAR ÉLÉMENT. Indexées par MATIÈRE, la Colette
     bordeaux et la Colette rouge — toutes deux en alligator —
     recevaient la même : on regardait un sac bordeaux avec une écaille
     écarlate à côté. Les 51 gros plans du shooting couvrent les cinq
     déclinaisons ; il suffisait de les nommer. */
  const zoom = macro(K.id, el.id);
  zoomCle = zoom;
  $('ditK').textContent = P.n + ' · ' + K.n + ' · ' + K.m;
  $('ditT').innerHTML = par(el.tPar, el.t);
  $('ditD').textContent = par(el.dPar, el.d);
  /* le zoom matière : il se remplace en fondu, il ne clignote pas */
  const z = $('ditZ');
  const anc = z.querySelector('img');
  if (!anc || anc.dataset.z !== zoom) {
    /* LA NOUVELLE MACRO PASSE AU-DESSUS DE L'ANCIENNE, et l'ancienne
       ne s'efface qu'ensuite. Insérée AVANT, elle montait en opacité
       SOUS une ancienne qui descendait : au croisement on avait deux
       demi-images sur un fond clair — le clignotement blanc que le
       client a vu. */
    const im = document.createElement('img');
    im.dataset.z = zoom; im.alt = el.zl; im.decoding = 'async';
    im.src = TOURS[zoom] || '';
    const montrer = () => requestAnimationFrame(() => {
      im.classList.add('on');
      if (anc) setTimeout(() => anc.remove(), 900);
    });
    im.onload = montrer;
    if (im.complete) montrer();
    z.insertBefore(im, $('ditZl'));
  }
  const leg = par(el.zlPar, el.zl);
  $('ditZl').textContent = leg;
  $('ditZ').onclick = () => ouvrirZoom(el, zoom, leg);
}

/* ═══════════ LES CHOIX DE PEAU ═══════════ */
function majChoix() {
  const P = PIECES[pieceIdx];
  $('choixK').textContent = 'La peau · ' + P.peaux.length +
    (P.peaux.length > 1 ? ' proposées' : ' proposée');
  const l = $('choixL'); l.innerHTML = '';
  P.peaux.forEach((k, i) => {
    const b = document.createElement('button');
    b.className = 'ch' + (i === peauIdx ? ' on' : '');
    b.dataset.peau = k.id;
    const p = (TOURS[k.id] || [])[0] || '';
    b.innerHTML = '<span class="ch__p" style="background-image:url(' + p + ')"></span>' +
      '<span class="ch__x"><span class="ch__n">' + esc(k.n) + '</span>' +
      '<span class="ch__k">' + esc(k.m) + '</span></span>';
    /* CHANGER DE PEAU GARDE L'ANGLE : on compare deux cuirs sous le
       même jour, c'est tout l'intérêt d'un tour photographié */
    b.onclick = () => habiller(pieceIdx, i, true);
    l.appendChild(b);
  });
}

/* ═══════════ LE ZOOM MATIÈRE, PLEIN CADRE ═══════════ */
function ouvrirZoom(el, zoom, leg) {
  const P = PIECES[pieceIdx], K = P.peaux[peauIdx];
  const par = (m, def) => (m && (m[P.id + '/' + K.m] || m[P.id])) || def;
  const i = $('plgI');
  const anc = i.querySelector('img'); if (anc) anc.remove();
  const im = document.createElement('img');
  im.alt = leg || el.zl; im.src = TOURS[zoom] || '';
  i.insertBefore(im, i.firstChild);
  $('plgT').innerHTML = par(el.tPar, el.t);
  $('plgD').textContent = par(el.dPar, el.d);
  $('plg').classList.add('on');
}
$('plgX').onclick = () => $('plg').classList.remove('on');
addEventListener('keydown', e => { if (e.key === 'Escape') $('plg').classList.remove('on'); });

/* ═══════════════════════════════════════════════════════════════
   LE CARROUSEL — l'anneau des modèles
   Une pièce au centre, debout et éclairée ; les autres en retrait,
   inclinées et sourdes. On tourne l'anneau, on ne défile pas une
   liste.
   ═══════════════════════════════════════════════════════════════ */
const ANNEAU = [];
PIECES.forEach((P, i) => P.peaux.forEach((k, j) => ANNEAU.push({ p: i, k: j, id: k.id, P, K: k })));
let carIdx = 0;
ANNEAU.forEach(a => {
  const d = document.createElement('div');
  d.className = 'car__p'; d.dataset.id = a.id;
  const im = document.createElement('img');
  im.alt = a.P.n + ' · ' + a.K.n; im.decoding = 'async'; im.draggable = false;
  /* le cadre se pose au format de la vue, donc DÈS QU'ON LE CONNAÎT :
     avant le décodage, `naturalWidth` vaut zéro et la boîte se
     mesurerait à rien */
  im.onload = () => { cadrerCar(); majCar(); };
  /* la vignette est la vue 0 de la séquence : elle se cale comme les
     autres, sinon le sac paraît décalé dans sa tuile */
  const c0 = ((TOURS.__tours__ || {})[a.id] || {}).cal;
  if (c0 && c0[0]) {
    im.style.transform = 'translate(' + (c0[0][0] * 100).toFixed(3) + '%,'
                                      + (c0[0][1] * 100).toFixed(3) + '%)';
  }
  im.src = (TOURS[a.id] || [])[0] || '';
  d.appendChild(im);
  const h = document.createElement('span');
  h.className = 'car__h';
  d.appendChild(h);
  a.hit = h;
  /* CLIQUER SUR UNE PIÈCE : de côté, elle vient au centre ; au centre,
     on entre dedans. Sans cela le carrousel ne répond pas au geste le
     plus naturel — et c'était le cas. */
  d.onclick = () => {
    if (glisse) return;
    if (ANNEAU.indexOf(a) === carIdx) prendre();
    else carVers(ANNEAU.indexOf(a));
  };
  $('carS').appendChild(d);
  a.el = d;
});
/* LA PART DE LA VUE QU'OCCUPE LA PIÈCE — relevée à l'export, dans
   tours.json. Un cadre n'est pas une pièce : selon le modèle, le sac
   tient de 44 à 57 % de la largeur de sa vue. Pour que TOUTES les
   pièces se montrent à la même taille apparente, on dimensionne la
   pièce, pas le cadre. */
function partDe(id) {
  const t = (TOURS.__tours__ || {})[id];
  if (!t || !t.piecemax) return .55;
  return Math.max(.22, Math.min(1, t.piecemax / (t.cadre ? t.cadre[0] : 1400)));
}
function largeurPiece(a) { return (a && a.larg ? a.larg : 640) * partDe(a && a.id); }

function cadrerCar() {
  const s = $('carS').getBoundingClientRect();
  if (!s.width || !s.height) return;
  ANNEAU.forEach(a => {
    const im = a.el.firstChild;
    /* LE FORMAT VIENT DE `tours.json`, PAS DU DÉCODAGE. En l'attendant,
       `naturalWidth` vaut zéro, la tuile se mesurait à rien, et le
       carrousel restait VIDE une seconde entière au chargement — c'est
       la première image que l'on voit du module. */
    const t0 = (TOURS.__tours__ || {})[a.id] || {};
    const nw = (t0.cadre && t0.cadre[0]) || im.naturalWidth || 1400;
    const nh = (t0.cadre && t0.cadre[1]) || im.naturalHeight || 930;
    /* LA PIÈCE TIENT LA MOITIÉ DE L'ÉCRAN, et l'on n'agrandit jamais
       la prise de vue au-delà de sa définition. */
    let w = Math.min(s.width * .5 / partDe(a.id), nw);
    let h = w * nh / nw;
    const hm = s.height * .97;
    if (h > hm) { h = hm; w = h * nw / nh; }
    a.el.style.width = Math.round(w) + 'px';
    a.el.style.height = Math.round(h) + 'px';
    a.larg = w;
    const t = (TOURS.__tours__ || {})[a.id] || {};
    const ch = t.cadre ? t.cadre[1] : nh;
    a.hit.style.width = Math.round(w * partDe(a.id)) + 'px';
    a.hit.style.height = Math.round(h * (t.hautmax ? t.hautmax / ch : .8)) + 'px';
  });
}

/* ═══════════ L'ÉVENTAIL ═══════════
   Au repos les pièces sont SERRÉES, presque l'une derrière l'autre :
   on voit un modèle, et l'on devine qu'il y en a d'autres. Dès qu'on
   pose la main dessus, l'éventail s'ouvre — les voisines s'écartent et
   se redressent — puis il se referme quand on lâche. C'est le geste de
   la référence, et c'est ce qui manquait : à écart fixe, les modèles
   paraissaient simplement éloignés les uns des autres. */
/* ELLES SE TOUCHENT, ELLES NE SE RECOUVRENT PAS. « Les sacs se
   superposent au lieu d'être juste rapprochés, format cover flow. »
   Le calcul : la pièce du centre occupe une demi-largeur de chaque
   côté ; la voisine, réduite (×.84), reculée (2000/2200) et tournée
   (cos 26°), en occupe .5 × .84 × .91 × .90 = .344. Il faut donc au
   moins .845 d'écart pour qu'elles ne mordent pas — on prend .90, et
   l'ouverture monte à 1.12 sous la main. */
const SERRE = .90, OUVERT = 1.12;
let carPos = 0, carCible = 0, ouv = 0, ouvCible = 0, battement = null, enGeste = false;
/* TROIS RAISONS D'OUVRIR L'ÉVENTAIL, et une seule valeur qui en
   découle. Chacune posait sa consigne dans son coin : le passage d'un
   modèle à l'autre refermait au bout de 400 ms un éventail que la main
   posée sur le pavé tenait ouvert, et l'on ne pouvait plus désigner une
   voisine. */
let survol = false, eclair = false;
function majOuverture() {
  const o = (survol || enGeste || eclair) ? 1 : 0;
  if (o === ouvCible) return;
  ouvCible = o; relancer();
}

/* L'ANNEAU SE REFERME. Sans cela, la première pièce n'a de voisines
   qu'à sa droite : la composition penche, et l'on croit la pièce
   décalée alors qu'elle est au milieu. Avec le bouclage, tout rang a
   une voisine de chaque côté. */
const N = ANNEAU.length;
function rang(d) { return ((d % N) + N + N / 2) % N - N / 2; }
function majCar() {
  const centre = ANNEAU[((Math.round(carPos) % N) + N) % N];
  const ec = largeurPiece(centre) * (SERRE + (OUVERT - SERRE) * ouv);
  ANNEAU.forEach((a, i) => {
    const d = rang(i - carPos), ad = Math.abs(d);
    const z = -Math.min(2.4, ad) * 200;
    const ry = Math.max(-30, Math.min(30, d * -26));
    const s = 1 - Math.min(.34, ad * .16);
    a.el.style.transform = 'translate(-50%,-50%) translateX(' + (d * ec).toFixed(1) + 'px) ' +
      'perspective(2000px) translateZ(' + z.toFixed(0) + 'px) rotateY(' + ry.toFixed(1) + 'deg) ' +
      'scale(' + s.toFixed(3) + ')';
    /* LA VOISINE GARDE SA COULEUR. À 0,67 d'opacité sur un fond
       papier, un carmin devient rose et un camel devient ivoire : sur
       la vidéo de recette, on croyait voir six modèles là où il y en a
       quatre. La profondeur se dit par l'échelle et la perspective, pas
       en délavant le cuir. */
    a.el.style.opacity = ad > 2.4 ? 0 : (1 - Math.max(0, ad - 1) * .26).toFixed(3);
    a.el.style.filter = ad > .05 ? 'brightness(' + (1 - Math.min(.14, ad * .07)).toFixed(3) + ')' : 'none';
    a.el.style.zIndex = String(60 - Math.round(ad * 10));
    a.hit.style.pointerEvents = ad > 2.4 ? 'none' : 'auto';
    a.el.classList.toggle('car__p--ici', ad < .5);
  });
  if (enGeste) {
    const n = ((Math.round(carPos) % N) + N) % N;
    if (n !== carIdx) { carIdx = n; majCartel(); }
  }
}
function majCartel() {
  const a = ANNEAU[carIdx];
  $('carN2').innerHTML = esc(a.P.n) + ' <em>' + esc(a.K.n) + '</em>';
  $('carK').textContent = a.K.m + ' · ' + a.P.k;
  $('carC').textContent = (carIdx + 1) + ' sur ' + ANNEAU.length;
  ambiance(a.K.amb);
  const j = $('carJ');
  j.style.width = (100 / ANNEAU.length) + '%';
  j.style.marginLeft = (carIdx * 100 / ANNEAU.length) + '%';
}
function battre() {
  const dp = carCible - carPos, dv = ouvCible - ouv;
  if (Math.abs(dp) < .0008 && Math.abs(dv) < .004) {
    /* une fois posé, on ramène la position dans l'anneau : à force de
       tourner dans le même sens elle dériverait sans fin */
    carPos = carCible = ((carCible % N) + N) % N;
    ouv = ouvCible; majCar(); battement = null; return;
  }
  carPos += dp * .17; ouv += dv * .13;
  majCar(); battement = requestAnimationFrame(battre);
}
function relancer() { if (battement === null) battement = requestAnimationFrame(battre); }
function carVers(n, sansOuvrir) {
  carIdx = ((n % N) + N) % N;
  /* on va vers le rang le plus PROCHE, pas vers son numéro : de la
     dernière pièce à la première, on continue dans le même sens */
  carCible = carPos + rang(carIdx - carPos);
  majCartel();
  if (RM) { carPos = carCible; ouv = 0; majCar(); return; }
  if (!sansOuvrir) {
    /* l'éventail s'ouvre le temps du passage, puis se referme : c'est
       le mouvement qui fait comprendre qu'il y a d'autres pièces */
    eclair = true; majOuverture();
    clearTimeout(carVers.t);
    carVers.t = setTimeout(() => { eclair = false; majOuverture(); }, 420);
  }
  relancer();
}
$('carP').onclick = () => carVers(carIdx - 1);
$('carN').onclick = () => carVers(carIdx + 1);
let glisse = false;
(function () {
  const c = $('car');
  let x0 = null, p0 = 0;
  const pas = () => Math.max(140, largeurPiece(ANNEAU[carIdx]) * .82);
  /* LA MAIN SUR LE PAVÉ SUFFIT À OUVRIR L'ÉVENTAIL. Serrées, les
     voisines sont derrière la pièce du centre : on ne peut pas les
     désigner, et cela se sent tout de suite. Au survol elles se
     dégagent — c'est le geste de la référence, et cela rend le clic
     possible. Au doigt, c'est le glissé qui ouvre. */
  /* on décide par la GÉOMÉTRIE, pas par `pointerenter`/`pointerleave` :
     les tuiles se déplacent sous le curseur à chaque image, et les
     entrées/sorties qui en découlent refermaient l'éventail au moment
     précis où l'on visait une voisine. Un point dans un rectangle ne
     ment pas. */
  if (matchMedia('(hover:hover)').matches) {
    addEventListener('pointermove', e => {
      const r = c.getBoundingClientRect();
      const dedans = e.clientX >= r.left && e.clientX <= r.right
                  && e.clientY >= r.top && e.clientY <= r.bottom;
      if (dedans === survol) return;
      survol = dedans; majOuverture();
    }, { passive: true });
  }
  c.addEventListener('dragstart', e => e.preventDefault());
  c.addEventListener('pointerdown', e => {
    x0 = e.clientX; p0 = carPos; carCible = carPos; glisse = false;
    enGeste = true; majOuverture();
  });
  c.addEventListener('pointermove', e => {
    if (x0 === null) return;
    const dx = x0 - e.clientX;
    if (Math.abs(dx) > 6) glisse = true;
    /* LA PIÈCE SUIT LE DOIGT : position continue, pas un cran tous les
       tiers d'écran. C'est ce qui donne le glissé de la référence. */
    carPos = carCible = p0 + dx / pas();
    ouv = Math.min(1, ouv + (1 - ouv) * .3);
    majCar();
  });
  const fin = () => {
    if (x0 === null) return;
    x0 = null; enGeste = false;
    carVers(Math.round(carCible), true);
    majOuverture();
    setTimeout(() => { glisse = false; }, 0);
  };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => c.addEventListener(t, fin));
  let reste = 0, repli = null;
  c.addEventListener('wheel', e => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) return;
    e.preventDefault(); reste += d;
    eclair = true; majOuverture();
    clearTimeout(repli); repli = setTimeout(() => { eclair = false; majOuverture(); }, 420);
    if (Math.abs(reste) > 52) { carVers(carIdx + Math.sign(reste), true); reste = 0; }
  }, { passive: false });
  addEventListener('keydown', e => {
    if (!$('sCar').classList.contains('on')) return;
    if (e.key === 'ArrowRight') carVers(carIdx + 1);
    if (e.key === 'ArrowLeft') carVers(carIdx - 1);
  });
})();
addEventListener('resize', cadrerCar);

/* ═══════════ LA NAVIGATION ═══════════ */
function versScene(n) {
  $('sCar').classList.toggle('on', n === 'car');
  $('sPiece').classList.toggle('on', n === 'piece');
  $('versCar').classList.toggle('on', n === 'car');
  $('versPiece').classList.toggle('on', n === 'piece');
  if (n === 'car') { cadrerCar(); majCar(); }
  else { cadrer(); }
}
function prendre() {
  const a = ANNEAU[carIdx];
  versScene('piece');
  return habiller(a.p, a.k, false);
}
$('carGo').onclick = prendre;
$('versCar').onclick = () => versScene('car');
$('versPiece').onclick = () => {
  versScene('piece');
  if (!vues.length) habiller(ANNEAU[carIdx].p, ANNEAU[carIdx].k, false);
};
$('choixGo').onclick = () => alert('Démonstration — dans la Plateforme, cette pièce ' +
  'devient une demande de rendez-vous assignée à Laurène.');
$('versRdv').onclick = $('choixGo').onclick;

cadrerCar(); majCartel(); majCar();

/* ═══════════ LES REPÈRES DE RECETTE ═══════════ */
window.__etat = () => ({
  scene: $('sPiece').classList.contains('on') ? 'piece' : 'car',
  car: carIdx, carTotal: ANNEAU.length,
  piece: PIECES[pieceIdx].id, peau: PIECES[pieceIdx].peaux[peauIdx].id,
  vues: vues.length, fraction: +fraction.toFixed(4),
  angle: Math.round(fraction * 360),
  element: ELEMENTS[elemIdx].id,
  macro: zoomCle,
  zoom: $('plg').classList.contains('on'),
  pres: $('tour').classList.contains('pres'),
  approche: +approcheK.toFixed(3),
  main: enMain,
  porte: [Math.round(vueT.x), Math.round(vueT.y)],
  ouverture: +ouv.toFixed(3),
  carPos: +carPos.toFixed(3),
  ambiance: getComputedStyle(document.documentElement).getPropertyValue('--ambiance').trim(),
  /* une empreinte de la vue : l'en-tête WebP est identique d'une vue à
     l'autre (mêmes dimensions), il faut donc piocher DANS la charge */
  source: (function () {
    const u = posee && posee.src || '';
    return u ? u.length + ':' + u.slice(Math.floor(u.length * .55),
                                        Math.floor(u.length * .55) + 24) : '';
  })(),
});
window.__scene = versScene;
window.__prendre = () => {
  const a = ANNEAU[carIdx];
  versScene('piece');
  return habiller(a.p, a.k, false);
};
window.__car = carVers;
/* la recette doit emprunter le VRAI chemin : le bouton, pas un
   raccourci qui court-circuiterait ce qu'elle prétend vérifier */
window.__peau = i => $('choixL').children[i].click();
window.__element = i => choisirElement(i);
window.__points = () => POINTS.map(p => ({ id: p.el.id,
  vu: p.b.classList.contains('vu'), on: p.b.classList.contains('on') }));
window.__poser = f => { arreterSuivi(); cibleF = ((f % 1) + 1) % 1; poser(f); };
window.__reculer = reculer;
window.__main = modeMain;
window.__caler = caler;
/* PRÊT VEUT DIRE : CETTE peau-ci est décodée. Un simple « il y a des
   vues » restait vrai avec celles de la peau précédente, et la recette
   lisait alors un état qui n'était plus le bon. */
window.__pret = () => !enCharge && vues.length > 0;
/* combien de vues étrangères à la séquence courante traînent dans le
   cadre — le fondu en pose deux, jamais une d'un autre tour */
window.__etrangeres = () => [...$('tourIm').children]
  .filter(v => v.tagName === 'IMG' && !vues.includes(v)).length;
</script>
</body></html>
