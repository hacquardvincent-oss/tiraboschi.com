<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIRABOSCHI — L'Expérience · Atelier sur mesure</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   TIRABOSCHI Paris — Atelier sur mesure
   Parti pris : il se passe toujours quelque chose. Le fond respire
   avec le cuir retenu, la pièce flotte, le prix se compose chiffre
   par chiffre, chaque élément repris se signale.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --noir:#0a0a0a; --blanc:#fff; --gris:#f7f5f2; --filet:#e8e8e8;
  --ease:cubic-bezier(.16,1,.3,1);
  --amb:#f7f5f2;          /* ambiance : prend la teinte du cuir */
  --amb-txt:#0a0a0a;
  --bar:92px;
}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
html{scroll-behavior:smooth}
body{
  font-family:'Playfair Display',Georgia,serif;
  color:var(--amb-txt);background:var(--amb);
  transition:background 1.1s var(--ease),color .8s var(--ease);
  -webkit-font-smoothing:antialiased;overflow-x:clip;padding-bottom:var(--bar);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ── Grain d'ambiance : le fond n'est jamais tout à fait plat ── */
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;mix-blend-mode:multiply}
.grain svg{width:100%;height:100%}

/* ═══ Bandeau ═══ */
.top{position:fixed;top:0;left:0;right:0;z-index:300;height:66px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(18px,4vw,46px);
  background:color-mix(in srgb,var(--amb) 86%,transparent);
  backdrop-filter:blur(18px);
  border-bottom:1px solid color-mix(in srgb,var(--amb-txt) 10%,transparent);
  transition:background 1.1s var(--ease),border-color .8s}
.top__back{font-size:10px;text-transform:uppercase;letter-spacing:.18em;opacity:.45;
  display:flex;align-items:center;gap:9px;transition:opacity .25s,gap .35s var(--ease)}
.top__back:hover{opacity:1;gap:14px}
.top__back svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.4}
.mark{font-size:13px;text-transform:uppercase;letter-spacing:.3em;
  transition:letter-spacing 1s var(--ease),opacity .5s}
.mark.pulse{letter-spacing:.56em;opacity:.55}
.rail{display:flex;gap:7px}
.rail i{width:24px;height:1px;background:currentColor;opacity:.14;
  transform:scaleX(0);transform-origin:left;
  transition:transform .7s var(--ease),opacity .5s}
.rail i.on{opacity:.9;transform:scaleX(1)}
@media(max-width:780px){.rail{display:none}}

/* ═══ Écrans ═══ */
.scr{display:none;min-height:100svh;padding-top:66px;position:relative;z-index:2}
.scr.on{display:block}
.hd{padding:clamp(34px,6vh,64px) clamp(18px,4vw,46px) clamp(20px,3vh,32px);text-align:center}
.hd__step{font-size:10px;text-transform:uppercase;letter-spacing:.3em;opacity:.32;margin-bottom:16px}
.hd__t{font-size:clamp(30px,4.6vw,58px);line-height:1;letter-spacing:-.025em}
.hd__t em{font-style:italic}
.hd__s{font-size:13px;line-height:1.75;opacity:.5;max-width:50ch;margin:15px auto 0}
/* Apparition par mots */
.wrd{display:inline-block;opacity:0;transform:translateY(14px) rotate(1.2deg);
  transition:opacity .7s var(--ease),transform .9s var(--ease)}
.wrd.in{opacity:1;transform:none}

/* ═══ 1 · Le modèle — vitrine animée ═══ */
.vitrine{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:color-mix(in srgb,var(--amb-txt) 8%,transparent);padding:1px}
.mdl{position:relative;background:var(--amb);cursor:pointer;overflow:hidden;
  padding:36px 22px 30px;text-align:left;min-height:clamp(320px,46vh,440px);
  display:flex;flex-direction:column;justify-content:flex-end;
  opacity:0;transform:translateY(26px);
  transition:opacity .8s var(--ease),transform .9s var(--ease),background .6s}
.mdl.in{opacity:1;transform:none}
.mdl__glow{position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity .7s var(--ease)}
.mdl:hover .mdl__glow{opacity:1}
.mdl__sil{position:absolute;left:50%;top:46%;width:64%;
  transform:translate(-50%,-50%) rotate(-3deg) scale(.94) var(--sil,scale(1));
  opacity:.14;pointer-events:none;
  transition:transform 1.1s var(--ease),opacity .7s var(--ease)}
.mdl:hover .mdl__sil{transform:translate(-50%,-52%) rotate(2deg) scale(1.06) var(--sil,scale(1));opacity:.3}
.mdl__n{font-size:clamp(20px,2.1vw,27px);letter-spacing:-.015em;position:relative}
.mdl__m{font-size:10px;text-transform:uppercase;letter-spacing:.18em;opacity:.42;margin-top:8px;position:relative}
.mdl__p{font-size:11px;font-style:italic;opacity:.55;margin-top:12px;position:relative;
  transition:opacity .4s,transform .5s var(--ease)}
.mdl:hover .mdl__p{opacity:.9;transform:translateX(4px)}
.mdl__go{position:absolute;right:22px;bottom:30px;width:30px;height:30px;
  border:1px solid currentColor;opacity:0;transform:translateX(-8px) rotate(-20deg);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .5s var(--ease),transform .6s var(--ease)}
.mdl:hover .mdl__go{opacity:.65;transform:none}
.mdl__go svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.3}
@media(max-width:900px){.vitrine{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.vitrine{grid-template-columns:1fr}.mdl{min-height:230px}}

/* Transition d'entrée dans l'atelier */
.curtain{position:fixed;inset:0;z-index:500;pointer-events:none;
  background:var(--amb);clip-path:inset(0 0 100% 0);
  transition:clip-path .85s var(--ease)}
.curtain.down{clip-path:inset(0 0 0 0)}
.curtain.up{clip-path:inset(100% 0 0 0)}

/* ═══ 2 · L'atelier ═══ */
.atl{position:relative;display:grid;grid-template-columns:1fr 340px;
  min-height:calc(100svh - 66px - var(--bar))}
@media(max-width:1000px){.atl{grid-template-columns:1fr;min-height:auto}}

.scene{position:relative;display:flex;align-items:center;justify-content:center;
  padding:10px 20px 40px;overflow:hidden}
.piece{position:relative;
  /* contrainte par la hauteur : sinon l'anse longue sort en haut
     et le fond passe sous la barre de prix */
  height:min(560px, calc(100svh - 66px - var(--bar) - 150px));
  width:auto;max-width:88%;
  animation:flotte 7s ease-in-out infinite;
  transition:transform .7s var(--ease)}
@keyframes flotte{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-11px) rotate(.5deg)}}
.piece svg{height:100%;width:auto;display:block;overflow:visible}
.piece.shift{transform:scale(1.035)}
/* Balayage de lumière au changement */
.sweep{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.5) 50%,transparent 62%);
  background-size:280% 100%}
.sweep.go{animation:balaye 1s var(--ease)}
@keyframes balaye{0%{opacity:0;background-position:180% 0}
  22%{opacity:1}100%{opacity:0;background-position:-80% 0}}

/* Partie mise en avant */
.hl{transition:opacity .4s var(--ease)}
.dim .hl:not(.act){opacity:.3}

/* ═══ Panneau des ajustements ═══ */
.side{border-left:1px solid color-mix(in srgb,var(--amb-txt) 10%,transparent);
  padding:26px 26px 40px;display:flex;flex-direction:column;gap:2px;
  max-height:calc(100svh - 66px - var(--bar));overflow-y:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
@media(max-width:1000px){.side{border-left:none;
  border-top:1px solid color-mix(in srgb,var(--amb-txt) 10%,transparent);max-height:none}}
.side__t{font-size:10px;text-transform:uppercase;letter-spacing:.24em;opacity:.35;
  margin-bottom:16px}
.adj{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:15px 0;border-bottom:1px solid color-mix(in srgb,var(--amb-txt) 9%,transparent);
  width:100%;text-align:left;position:relative;
  transition:padding-left .4s var(--ease)}
.adj:hover{padding-left:8px}
.adj::before{content:'';position:absolute;left:0;top:50%;width:0;height:1px;
  background:currentColor;opacity:.5;transition:width .4s var(--ease)}
.adj:hover::before{width:4px}
.adj__n{font-size:13px;display:block}
.adj__v{font-size:10px;text-transform:uppercase;letter-spacing:.14em;opacity:.4;display:block;
  margin-top:4px;transition:opacity .3s}
.adj.set .adj__v{opacity:.75;font-style:italic;text-transform:none;letter-spacing:.02em}
.adj__x{font-size:9px;text-transform:uppercase;letter-spacing:.14em;opacity:.3;white-space:nowrap}
.adj.set .adj__x{opacity:.7}

/* Curseur de longueur d'anse */
.rng{width:100%;-webkit-appearance:none;appearance:none;height:1px;
  background:color-mix(in srgb,var(--amb-txt) 22%,transparent);margin:16px 0 4px;cursor:pointer}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
  background:var(--amb-txt);cursor:grab;transition:transform .2s}
.rng::-webkit-slider-thumb:active{transform:scale(1.35);cursor:grabbing}
.rng::-moz-range-thumb{width:13px;height:13px;border:none;background:var(--amb-txt)}

/* Bascules */
.tgl{display:flex;align-items:center;gap:11px}
.tgl__b{width:32px;height:16px;border:1px solid currentColor;opacity:.35;
  position:relative;transition:opacity .3s,background .3s}
.tgl__b::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;
  background:currentColor;transition:transform .35s var(--ease)}
.adj.set .tgl__b{opacity:1}
.adj.set .tgl__b::after{transform:translateX(16px)}

/* ═══ Cover Flow matière — plein écran ═══ */
.mat{position:fixed;inset:0;z-index:400;display:none;flex-direction:column;
  background:var(--mat-bg,#0a0a0a);color:#fff;transition:background 1s var(--ease)}
.mat.on{display:flex;animation:matIn .5s var(--ease)}
@keyframes matIn{from{opacity:0}to{opacity:1}}
.mat__h{padding:24px clamp(18px,4vw,46px) 0;display:flex;justify-content:space-between;gap:18px}
.mat__t{font-size:clamp(19px,2.3vw,29px);font-style:italic}
.mat__x{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:#fff;opacity:.5}
.mat__x:hover{opacity:1}
.mat__f{display:flex;gap:22px;justify-content:center;padding:22px 18px 0;flex-wrap:wrap}
.ft{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:#fff;opacity:.32;
  padding-bottom:7px;position:relative;transition:opacity .3s}
.ft::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:1px;background:#fff;
  transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.ft.on{opacity:1}.ft.on::after{transform:scaleX(1)}
.flow{flex:1;position:relative;perspective:1250px;cursor:grab;min-height:0}
.flow:active{cursor:grabbing}
.card{position:absolute;top:50%;left:50%;
  width:min(520px,74vw);height:min(520px,54svh);
  opacity:0;pointer-events:none;
  transition:transform .55s var(--ease),opacity .55s var(--ease)}
.card.vis{pointer-events:auto}
.card__s{width:100%;height:100%;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.13)}
.card.mid .card__s{border-color:rgba(255,255,255,.5);box-shadow:0 30px 80px rgba(0,0,0,.62)}
.card__s svg{width:100%;height:100%;display:block}
.mat__cap{text-align:center;padding:0 18px}
.mat__n{font-size:clamp(21px,2.9vw,33px);min-height:1.2em}
.mat__d{font-size:11px;text-transform:uppercase;letter-spacing:.18em;opacity:.45;
  margin-top:9px;min-height:1.4em}
.mat__c{font-size:9px;letter-spacing:.24em;opacity:.28;margin-top:12px}
.mat__ft{display:flex;gap:20px;align-items:center;justify-content:center;padding:18px 18px 30px}
.nav{width:37px;height:37px;border:1px solid rgba(255,255,255,.26);color:#fff;
  display:flex;align-items:center;justify-content:center;transition:border-color .25s,background .25s}
.nav:hover:not(:disabled){border-color:#fff;background:rgba(255,255,255,.07)}
.nav:disabled{opacity:.16}
.nav svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.3}
.pick{border:1px solid rgba(255,255,255,.6);color:#fff;padding:13px 38px;
  font-size:10px;text-transform:uppercase;letter-spacing:.2em;
  transition:background .25s,border-color .25s,letter-spacing .4s var(--ease)}
.pick:hover{background:rgba(255,255,255,.09);border-color:#fff;letter-spacing:.26em}

/* ═══ Récapitulatif ═══ */
.rec{max-width:780px;margin:0 auto;padding:0 clamp(18px,4vw,46px) 60px}
.rec__r{display:flex;justify-content:space-between;gap:18px;padding:16px 0;
  border-top:1px solid color-mix(in srgb,var(--amb-txt) 11%,transparent);
  opacity:0;transform:translateY(10px);
  transition:opacity .6s var(--ease),transform .7s var(--ease)}
.rec__r.in{opacity:1;transform:none}
.rec__k{font-size:10px;text-transform:uppercase;letter-spacing:.18em;opacity:.4}
.rec__v{font-size:14px;text-align:right}
.rec__v small{display:block;font-size:11px;opacity:.45;margin-top:3px;font-style:italic}
.rec__tot{display:flex;justify-content:space-between;align-items:baseline;
  padding:24px 0;border-top:1px solid currentColor;margin-top:6px}
.rec__tk{font-size:11px;text-transform:uppercase;letter-spacing:.2em}
.rec__tv{font-size:clamp(25px,3.3vw,37px)}
.rec__n{font-size:12px;line-height:1.8;opacity:.5;margin-top:22px;padding-top:20px;
  border-top:1px solid color-mix(in srgb,var(--amb-txt) 11%,transparent)}
.rec__c{display:block;width:100%;margin-top:26px;border:1px solid currentColor;
  padding:18px;font-size:11px;text-transform:uppercase;letter-spacing:.2em;text-align:center;
  transition:background .3s,color .3s,letter-spacing .5s var(--ease)}
.rec__c:hover{background:var(--amb-txt);color:var(--amb);letter-spacing:.28em}

/* ═══ Barre de prix ═══ */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:350;height:var(--bar);
  background:color-mix(in srgb,var(--amb) 92%,transparent);backdrop-filter:blur(20px);
  border-top:1px solid color-mix(in srgb,var(--amb-txt) 11%,transparent);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(18px,4vw,46px);gap:18px;transition:background 1.1s var(--ease)}
.bar__l{font-size:10px;text-transform:uppercase;letter-spacing:.2em;opacity:.4}
.bar__p{font-size:clamp(21px,2.5vw,29px);margin-top:5px;display:flex;gap:1px}
.bar__p span{display:inline-block;white-space:pre;transition:transform .4s var(--ease),opacity .4s}
.bar__p span.roll{animation:roll .5s var(--ease)}
@keyframes roll{0%{transform:translateY(-70%);opacity:0}100%{transform:none;opacity:1}}
.bar__n{border:1px solid currentColor;padding:14px 32px;font-size:10px;
  text-transform:uppercase;letter-spacing:.2em;white-space:nowrap;
  transition:background .3s,color .3s,letter-spacing .5s var(--ease)}
.bar__n:hover:not(:disabled){background:var(--amb-txt);color:var(--amb);letter-spacing:.27em}
.bar__n:disabled{opacity:.2;cursor:default}
@media(max-width:600px){:root{--bar:80px}.bar__n{padding:12px 18px;font-size:9px;letter-spacing:.13em}}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .piece{animation:none}.wrd{opacity:1;transform:none}
  .mdl{opacity:1;transform:none}.rec__r{opacity:1;transform:none}
  .rail i{transform:scaleX(1)}
}
</style>
</head>
<body>

<!-- Grain d'ambiance -->
<div class="grain" aria-hidden="true"><svg><filter id="gr">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .045 0"/></filter>
  <rect width="100%" height="100%" filter="url(#gr)"/></svg></div>

<!-- Filtres cuir + motifs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="pats">
  <filter id="lth-graine" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" stitchTiles="stitch" baseFrequency="0.62" numOctaves="4" seed="7" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="1.5" diffuseConstant="1.15" result="d">
      <feDistantLight azimuth="128" elevation="60"/></feDiffuseLighting>
    <feComposite in="d" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="t"/>
    <feSpecularLighting in="n" lighting-color="#fff" surfaceScale="1.5"
      specularConstant="0.16" specularExponent="12" result="s">
      <feDistantLight azimuth="128" elevation="60"/></feSpecularLighting>
    <feComposite in="s" in2="t" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="l"/>
    <feComposite in="l" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="lth-lisse" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" stitchTiles="stitch" baseFrequency="0.32" numOctaves="2" seed="3" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="0.1" diffuseConstant="1.02" result="d">
      <feDistantLight azimuth="118" elevation="74"/></feDiffuseLighting>
    <feComposite in="d" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="t"/>
    <feSpecularLighting in="n" lighting-color="#fff" surfaceScale="0.1"
      specularConstant="0.34" specularExponent="55" result="s">
      <feDistantLight azimuth="118" elevation="74"/></feSpecularLighting>
    <feComposite in="s" in2="t" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="l"/>
    <feComposite in="l" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="lth-daim" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" stitchTiles="stitch" baseFrequency="1.7" numOctaves="5" seed="11" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="0.75" diffuseConstant="1.1" result="d">
      <feDistantLight azimuth="140" elevation="48"/></feDiffuseLighting>
    <feComposite in="d" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="t"/>
    <feSpecularLighting in="n" lighting-color="#fff" surfaceScale="0.75"
      specularConstant="0.04" specularExponent="5" result="s">
      <feDistantLight azimuth="140" elevation="48"/></feSpecularLighting>
    <feComposite in="s" in2="t" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="l"/>
    <feComposite in="l" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="lth-exotique" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" stitchTiles="stitch" baseFrequency="0.10 0.30" numOctaves="3" seed="5" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="1.9" diffuseConstant="1.12" result="d">
      <feDistantLight azimuth="120" elevation="54"/></feDiffuseLighting>
    <feComposite in="d" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="t"/>
    <feSpecularLighting in="n" lighting-color="#fff" surfaceScale="1.9"
      specularConstant="0.22" specularExponent="18" result="s">
      <feDistantLight azimuth="120" elevation="54"/></feSpecularLighting>
    <feComposite in="s" in2="t" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="l"/>
    <feComposite in="l" in2="SourceGraphic" operator="in"/>
  </filter>
</defs></svg>

<div class="curtain" id="curtain" aria-hidden="true"></div>

<header class="top">
  <button class="top__back" id="back">
    <svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg><span id="backL">Retour</span>
  </button>
  <span class="mark" id="mark">Tiraboschi</span>
  <div class="rail" id="rail" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
</header>

<!-- ═══ 1 · VITRINE ═══ -->
<section class="scr on" id="s1">
  <div class="hd">
    <p class="hd__step">Atelier sur mesure</p>
    <h1 class="hd__t" data-split>Tout part d'une <em>silhouette</em></h1>
    <p class="hd__s" data-split>Choisissez la pièce que vous voulez reprendre. Sa structure reste ; tout le reste vous appartient.</p>
  </div>
  <div class="vitrine" id="vitrine"></div>
</section>

<!-- ═══ 2 · ATELIER ═══ -->
<section class="scr" id="s2">
  <div class="hd">
    <p class="hd__step">L'atelier</p>
    <h1 class="hd__t" id="atlT">Reprenez ce qui <em>doit l'être</em></h1>
  </div>
  <div class="atl">
    <div class="scene">
      <div class="piece" id="piece">
<svg viewBox="0 0 460 560" id="svgPiece" aria-label="La pièce en cours de conception">
  <defs>
    <linearGradient id="volume" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#000" stop-opacity=".26"/>
      <stop offset=".22"  stop-color="#000" stop-opacity="0"/>

];

var FAMILLES=[{id:'tous',n:'Tous les cuirs'},{id:'graine',n:'Grainé'},
  {id:'lisse',n:'Lisse'},{id:'daim',n:'Daim'},{id:'exotique',n:'Exotique'}];

var MODELES=[
  {id:'victoire',nom:'La Victoire',t:'Sac à main structuré',base:3200,teinte:'#6b4a32',sil:'scale(1,1.06)'},
  {id:'colette', nom:'La Colette', t:'Sac à main souple',   base:2800,teinte:'#5e1f2c',sil:'scale(.94,.9)'},
  {id:'jane',    nom:'La Jane',    t:'Tote',                base:2400,teinte:'#243352',sil:'scale(1.12,.98)'},
  {id:'rafael',  nom:'Le Rafaël',  t:'Pochette',            base:1600,teinte:'#1e3a30',sil:'scale(1.04,.6)',plat:1}
];

var FERRURES=[{id:'laiton',n:'Laiton naturel',d:0},{id:'vieilli',n:'Laiton vieilli',d:120},
  {id:'palladium',n:'Argent palladié',d:340},{id:'or24',n:'Or jaune 24 carats',d:1800}];
var DOUBLURES=[{id:'agneau',n:'Agneau naturel',d:0,c:'#c9bda8'},
  {id:'chevreau',n:'Chevreau glacé',d:160,c:'#ddd2bc'},
  {id:'soie',n:'Soie sauvage',d:240,c:'#b9a68c'}];
var MTL={laiton:'#bb9a5c',vieilli:'#8a6f42',palladium:'#a8adb2',or24:'#d4a92e'};

/* ═══ État ═══ */
var S={mdl:null,ecran:1,cuirs:{},opts:{ferrures:'laiton',doublure:'agneau'},
       anse:50,pieds:false,bijou:false,bi:false,grav:''};

function euros(n){return n.toLocaleString('fr-FR').replace(/\u202f|\u00a0/g,' ')+' €'}

/* ═══ Motifs cuir — tuile unique, créée à la demande ═══ */
var faits={};
function motif(c,t){
  var id='p-'+t+'-'+c.replace('#','');
  if(!faits[id]){
    var p=document.createElementNS(NS,'pattern');
    p.setAttribute('id',id);p.setAttribute('width','150');p.setAttribute('height','150');
    p.setAttribute('patternUnits','userSpaceOnUse');
    var r=document.createElementNS(NS,'rect');
    r.setAttribute('width','150');r.setAttribute('height','150');
    r.setAttribute('fill',c);r.setAttribute('filter','url(#lth-'+t+')');
    p.appendChild(r);$('pats').appendChild(p);faits[id]=1;
  }
  return 'url(#'+id+')';
}
function cuirPar(id){for(var i=0;i<MATIERES.length;i++)if(MATIERES[i].id===id)return MATIERES[i];return null}
function assombrir(h,k){var n=parseInt(h.slice(1),16);
  return '#'+((1<<24)+((Math.round(((n>>16)&255)*k))<<16)+((Math.round(((n>>8)&255)*k))<<8)+Math.round((n&255)*k)).toString(16).slice(1)}
function clair(h){var n=parseInt(h.slice(1),16);
  return (((n>>16)&255)*299+((n>>8)&255)*587+(n&255)*114)/1000>140}

/* ═══ Ambiance — le fond prend la teinte du cuir ═══ */
function ambiance(hex){
  var d=document.documentElement;
  if(!hex){d.style.setProperty('--amb','#f7f5f2');d.style.setProperty('--amb-txt','#0a0a0a');return}
  var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  d.style.setProperty('--amb','rgb('+Math.round(247-(247-r)*.11)+','+
    Math.round(245-(245-g)*.11)+','+Math.round(242-(242-b)*.11)+')');
  d.style.setProperty('--amb-txt','#0a0a0a');
}

/* ═══ Prix — se compose chiffre par chiffre ═══ */
function total(){
  if(!S.mdl)return 0;
  var t=S.mdl.base;
  ['ext','int','v'].forEach(function(k){var c=S.cuirs[k];if(c)t+=cuirPar(c).delta});
  FERRURES.forEach(function(f){if(f.id===S.opts.ferrures)t+=f.d});
  DOUBLURES.forEach(function(f){if(f.id===S.opts.doublure)t+=f.d});
  if(S.anse!==50) t+=140;
  if(S.pieds) t+=180;
  if(S.bijou) t+=460;
  if(S.bi)    t+=380;
  if(S.grav)  t+=180;
  return t;
}
var dernier='';
function majPrix(){
  $('barL').textContent = S.mdl ? S.mdl.nom+' — sur mesure' : 'Aucune silhouette';
  var txt = S.mdl ? euros(total()) : '—', el=$('barP');
  if(txt===dernier) return;
  el.innerHTML='';
  txt.split('').forEach(function(ch,i){
    var s=document.createElement('span');s.textContent=ch;
    if(!RM && dernier && dernier[i]!==ch){s.classList.add('roll');s.style.animationDelay=(i*22)+'ms'}
    el.appendChild(s);
  });
  dernier=txt;
}

/* ═══ Rendu de la pièce ═══ */
function peindre(){
  var ext=S.cuirs.ext?cuirPar(S.cuirs.ext):null;
  var col=ext?ext.c:'#6b4a32', typ=ext?ext.type:'graine';
  var q=function(i){return $(i)};
  q('corps').setAttribute('fill',motif(col,typ));
  q('soufflet').setAttribute('fill',motif(assombrir(col,.84),typ));
  /* Le V : matière propre en bi-matière, sinon nuance du corps */
  var v=S.bi&&S.cuirs.v?cuirPar(S.cuirs.v):null;
  q('pV').setAttribute('fill', v?motif(v.c,v.type):motif(assombrir(col,.8),typ));
  /* Anse */
  var a=S.cuirs.anse?cuirPar(S.cuirs.anse):ext;
  q('anse').setAttribute('stroke', a?motif(a.c,a.type):motif(col,typ));
  /* Doublure */
  var dd=DOUBLURES.filter(function(x){return x.id===S.opts.doublure})[0];
  q('doublure').setAttribute('fill',motif(S.cuirs.int?cuirPar(S.cuirs.int).c:dd.c,'lisse'));
  /* Ferrures */
  var m=MTL[S.opts.ferrures]||'#bb9a5c';
  ['grpFer','grpPieds','grpBijou'].forEach(function(g){
    var n=q(g);if(!n)return;
    n.querySelectorAll('[fill^="url(#mtl"],[stroke^="url(#mtl"]').forEach(function(){});
  });
  document.querySelectorAll('#svgPiece [fill="url(#mtl)"]').forEach(function(n){n.setAttribute('fill',m)});
  document.querySelectorAll('#svgPiece [stroke="url(#mtl)"]').forEach(function(n){n.setAttribute('stroke',m)});
  /* Anse : la longueur change la courbure */
  var h=190-(S.anse-50)*1.5, d='M152 190 C152 '+(h-60)+' 308 '+(h-60)+' 308 190';
  q('anse').setAttribute('d',d); q('anseOmbre').setAttribute('d',d);
  /* Options visibles */
  q('grpPieds').setAttribute('opacity',S.pieds?'1':'0');
  q('grpBijou').setAttribute('opacity',S.bijou?'1':'0');
  var g=q('grav'); g.textContent=S.grav; g.setAttribute('opacity',S.grav?'1':'0');
  g.setAttribute('fill',clair(col)?'#000':'#fff');
  ambiance(col);
}
function souligner(){
  if(RM) return;
  var p=$('piece'), s=$('sweep');
  p.classList.add('shift'); s.classList.remove('go'); void s.offsetWidth; s.classList.add('go');
  setTimeout(function(){p.classList.remove('shift')},420);
}

/* ═══ Vitrine ═══ */
var SIL='<svg viewBox="0 0 460 560"><path d="M74 196 Q74 188 84 188 L376 188 Q386 188 386 196 L366 470 Q363 492 342 492 L118 492 Q97 492 94 470 Z" fill="currentColor"/><path d="M152 190 C152 78 308 78 308 190" fill="none" stroke="currentColor" stroke-width="15"/></svg>';
MODELES.forEach(function(m,i){

function choisir(m){
  S.mdl=m; S.cuirs={}; S.opts={ferrures:'laiton',doublure:'agneau'};
  S.anse=50;S.pieds=false;S.bijou=false;S.bi=false;S.grav='';
  $('next').disabled=false;
  var c=$('curtain');
  if(RM){ aller(2); peindre(); majPrix(); construireSide(); return; }
  c.classList.add('down');
  setTimeout(function(){
    aller(2); peindre(); majPrix(); construireSide();
    c.classList.remove('down'); c.classList.add('up');
    setTimeout(function(){c.classList.remove('up')},900);
  },860);
}

  {k:'ext', t:'cuir', n:'Cuir extérieur',  d:'Le corps et le soufflet'},

function construireSide(){
  var s=$('side'); s.innerHTML='<p class="side__t">Les ajustements</p>';
  AJUST.forEach(function(a,i){
    var b=document.createElement('button'); b.className='adj'; b.dataset.k=a.k;
    s.appendChild(b);
    if(a.t==='range'){
      b.style.display='block';
      b.innerHTML='<span class="adj__n">'+a.n+'</span>'+
        '<input class="rng" type="range" min="0" max="100" value="'+S.anse+'">'+
        '<span class="adj__v" data-v>'+libAnse()+'</span>';
      var r=b.querySelector('.rng');
      r.addEventListener('input',function(){
        S.anse=+r.value; b.querySelector('[data-v]').textContent=libAnse();
        b.classList.toggle('set',S.anse!==50); peindre(); majPrix();
      });
      r.addEventListener('click',function(e){e.stopPropagation()});
      return;
    }
    b.innerHTML='<span><span class="adj__n">'+a.n+'</span>'+
      '<span class="adj__v" data-v>'+(a.d||'')+'</span></span>'+
      (a.t==='tgl'
        ? '<span class="tgl"><span class="adj__x">+ '+euros(a.p)+'</span><span class="tgl__b"></span></span>'
        : '<span class="adj__x" data-x></span>');
    b.addEventListener('click',function(){ouvrirAjust(a,b)});
    setTimeout(function(){b.style.opacity='1'}, RM?0:i*40);
  });
  rafraichirSide();
}
function libAnse(){
  if(S.anse<34) return 'Portée main — anse courte';
  if(S.anse>66) return 'Portée épaule — anse longue';
  return 'Longueur d\'origine';
}
function rafraichirSide(){
  document.querySelectorAll('.adj').forEach(function(b){
    var k=b.dataset.k, a=AJUST.filter(function(x){return x.k===k})[0]; if(!a)return;
    var v=b.querySelector('[data-v]'), x=b.querySelector('[data-x]');
    if(a.t==='cuir'){
      var c=S.cuirs[k]?cuirPar(S.cuirs[k]):null;
      if(c){b.classList.add('set');v.textContent=c.nom;if(x)x.textContent=c.delta?'+ '+euros(c.delta):'inclus'}
      else{b.classList.remove('set');v.textContent=a.d;if(x)x.textContent='choisir'}
    }else if(a.t==='bi'){
      if(S.bi&&S.cuirs.v){b.classList.add('set');v.textContent=cuirPar(S.cuirs.v).nom;
        if(x)x.textContent='+ '+euros(380+cuirPar(S.cuirs.v).delta)}
      else{b.classList.remove('set');v.textContent=a.d;if(x)x.textContent='+ '+euros(380)}
    }else if(a.t==='opt'){
      var o=a.opts.filter(function(y){return y.id===S.opts[k]})[0];
      v.textContent=o.n; b.classList.toggle('set',o.d>0);
      if(x)x.textContent=o.d?'+ '+euros(o.d):'inclus';
    }else if(a.t==='tgl'){
      b.classList.toggle('set',!!S[k]); v.textContent=a.d;
    }else if(a.t==='grav'){
      b.classList.toggle('set',!!S.grav);
      v.textContent=S.grav||a.d; if(x)x.textContent=S.grav?'+ '+euros(180):'+ '+euros(180);
    }
    if(a.t==='range'){b.classList.toggle('set',S.anse!==50)}
  });
}
function ouvrirAjust(a,b){
  if(a.t==='cuir'){ ouvrirCuir(a.k,a.n); return; }
  if(a.t==='bi'){
    if(S.bi&&S.cuirs.v){S.bi=false;delete S.cuirs.v;maj();return}
    S.bi=true; ouvrirCuir('v','Le second cuir'); return;
  }
  if(a.t==='opt'){
    var l=a.opts, i=l.findIndex(function(y){return y.id===S.opts[a.k]});
    S.opts[a.k]=l[(i+1)%l.length].id; maj(); return;
  }
  if(a.t==='tgl'){ S[a.k]=!S[a.k]; maj(); return; }
  if(a.t==='grav'){
    var v=prompt('Initiales — trois lettres',S.grav||'');
    if(v!==null){S.grav=v.toUpperCase().slice(0,4);maj()}
  }
}
function maj(){peindre();majPrix();rafraichirSide();souligner()}

/* ═══ Cover Flow ═══ */
var cible=null, filtre='tous', idx=0, cartes=[];
function liste(){return filtre==='tous'?MATIERES:MATIERES.filter(function(m){return m.type===filtre})}
FAMILLES.forEach(function(f){
  var b=document.createElement('button');
  b.className='ft'+(f.id==='tous'?' on':'');b.textContent=f.n;b.dataset.f=f.id;
  b.addEventListener('click',function(){
    filtre=f.id;idx=0;
    document.querySelectorAll('.ft').forEach(function(x){x.classList.toggle('on',x.dataset.f===f.id)});
    batir();
  });
  $('matF').appendChild(b);
});
function batir(){
  var f=$('flow');f.innerHTML='';cartes=[];
  liste().forEach(function(m,i){
    var c=document.createElement('div');c.className='card';c.dataset.i=i;
    c.innerHTML='<div class="card__s"></div>';
    c.addEventListener('click',function(){if(i!==idx){idx=i;rendre()}});
    f.appendChild(c);cartes.push(c);
  });
  if(idx>=cartes.length)idx=0;
  rendre();
}
function rendre(){
  var L=liste();
  cartes.forEach(function(c,i){
    var d=i-idx,a=Math.abs(d),s=d<0?-1:1,tx,ry,sc,op,z;
    if(d===0){tx='-50%';ry='0deg';sc=1;op=1;z=100}
    else{var g=310+a*82;tx='calc(-50% + '+(s*g)+'px)';ry=(-s*44)+'deg';
      sc=Math.max(.45,1-a*.2);op=Math.max(0,1-a*.36);z=100-a*10}
    c.style.transform='translateX('+tx+') translateY(-50%) rotateY('+ry+') scale('+sc+')';
    c.style.opacity=op;c.style.zIndex=z;
    c.classList.toggle('mid',d===0);c.classList.toggle('vis',a<=3);
    /* Texture créée seulement à l'approche : 55 cuirs d'un coup figeraient tout */
    if(a<=3 && !c.dataset.peint){
      var m=L[i];
      c.querySelector('.card__s').innerHTML=
        '<svg viewBox="0 0 520 520" preserveAspectRatio="none"><rect width="520" height="520" fill="'+
        motif(m.c,m.type)+'"/></svg>';
      c.dataset.peint='1';
    }
  });
  var m=L[idx];
  $('matN').textContent=m?m.nom:'';
  $('matD').textContent=m?(m.delta?'+ '+euros(m.delta):'Sans supplément'):'';
  $('matC').textContent=m?((idx+1)+' / '+L.length):'';
  if(m) $('mat').style.setProperty('--mat-bg',assombrir(m.c,.34));
  $('matP').disabled=idx===0;$('matN2').disabled=idx>=L.length-1;
}
function ouvrirCuir(k,titre){
  cible=k;$('matT').textContent=titre;
  var d=S.cuirs[k];
  if(d){var i=liste().findIndex(function(m){return m.id===d});if(i>=0)idx=i}
  $('mat').classList.add('on');document.body.style.overflow='hidden';
  cartes.forEach(function(c){delete c.dataset.peint});
  batir();
}
function fermerCuir(){$('mat').classList.remove('on');document.body.style.overflow=''}
$('matX').addEventListener('click',function(){ if(cible==='v'&&!S.cuirs.v){S.bi=false;rafraichirSide()} fermerCuir()});
$('matP').addEventListener('click',function(){if(idx>0){idx--;rendre()}});
$('matN2').addEventListener('click',function(){if(idx<liste().length-1){idx++;rendre()}});
$('matK').addEventListener('click',function(){
  var m=liste()[idx];if(!m)return;
  S.cuirs[cible]=m.id; if(cible==='v')S.bi=true;
  maj(); fermerCuir();
});
document.addEventListener('keydown',function(e){
  if(!$('mat').classList.contains('on'))return;
  if(e.key==='Escape')fermerCuir();
  if(e.key==='ArrowLeft'&&idx>0){idx--;rendre()}
  if(e.key==='ArrowRight'&&idx<liste().length-1){idx++;rendre()}
});
(function(){var x0=null;
  function fin(x){if(x0===null)return;var d=x-x0;x0=null;if(Math.abs(d)<36)return;
    if(d<0&&idx<liste().length-1)idx++;else if(d>0&&idx>0)idx--;rendre()}
  var f=$('flow');
  f.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  f.addEventListener('touchend',function(e){fin(e.changedTouches[0].clientX)},{passive:true});
  f.addEventListener('mousedown',function(e){x0=e.clientX});
  f.addEventListener('mouseup',function(e){fin(e.clientX)});
  f.addEventListener('mouseleave',function(){x0=null});
})();

/* ═══ Navigation ═══ */
function aller(n){
  S.ecran=n;
  [1,2,3].forEach(function(i){$('s'+i).classList.toggle('on',i===n)});
  document.querySelectorAll('.rail i').forEach(function(t,j){t.classList.toggle('on',j<n)});
  $('backL').textContent=n===1?'Retour':'Étape précédente';
  $('next').textContent=n===3?'Envoyer à mon conseiller':'Continuer';
  $('next').disabled=(n===1&&!S.mdl);
  var m=$('mark'); m.classList.add('pulse'); setTimeout(function(){m.classList.remove('pulse')},700);
  if(n===3)dessinerRecap();
  window.scrollTo(0,0); animerMots();
}
$('next').addEventListener('click',function(){
  if(S.ecran===3){envoyer();return}
  aller(Math.min(3,S.ecran+1));
});
$('back').addEventListener('click',function(){if(S.ecran>1)aller(S.ecran-1)});

/* ═══ Titres mot à mot ═══ */
function animerMots(){
  document.querySelectorAll('.scr.on [data-split]').forEach(function(el){
    if(!el.dataset.done){
      el.dataset.done='1';
      var h=el.innerHTML.split(/(<em>.*?<\/em>)/g);
      el.innerHTML=h.map(function(seg){
        if(seg.startsWith('<em>'))return '<span class="wrd">'+seg+'</span>';
        return seg.split(' ').filter(Boolean).map(function(w){
          return '<span class="wrd">'+w+'</span>'}).join(' ');
      }).join(' ');
    }
    el.querySelectorAll('.wrd').forEach(function(w,i){
      w.classList.remove('in');
      setTimeout(function(){w.classList.add('in')}, RM?0:90+i*52);
    });
  });
}

/* ═══ Récapitulatif ═══ */
function dessinerRecap(){
  var r=$('rec');r.innerHTML='';
  if(!S.mdl){r.innerHTML='<p class="rec__n">Aucune silhouette retenue.</p>';return}
  var lignes=[['Silhouette',S.mdl.nom,S.mdl.t+' · '+euros(S.mdl.base)]];
  if(S.cuirs.ext){var c=cuirPar(S.cuirs.ext);lignes.push(['Cuir extérieur',c.nom,c.delta?'+ '+euros(c.delta):'sans supplément'])}
  if(S.bi&&S.cuirs.v){var v=cuirPar(S.cuirs.v);lignes.push(['Bi-matière — le V',v.nom,'+ '+euros(380+v.delta)])}
  if(S.cuirs.anse){var a=cuirPar(S.cuirs.anse);lignes.push(["Cuir de l'anse",a.nom,a.delta?'+ '+euros(a.delta):'sans supplément'])}
  if(S.anse!==50)lignes.push(["Longueur d'anse",libAnse(),'+ '+euros(140)]);
  if(S.cuirs.int){var i2=cuirPar(S.cuirs.int);lignes.push(['Cuir intérieur',i2.nom,i2.delta?'+ '+euros(i2.delta):'sans supplément'])}
  var dd=DOUBLURES.filter(function(x){return x.id===S.opts.doublure})[0];
  lignes.push(['Doublure',dd.n,dd.d?'+ '+euros(dd.d):'incluse']);
  var ff=FERRURES.filter(function(x){return x.id===S.opts.ferrures})[0];
  lignes.push(['Ferrures',ff.n,ff.d?'+ '+euros(ff.d):'incluses']);
  if(S.pieds)lignes.push(['Pieds de protection','Cinq clous, laiton','+ '+euros(180)]);
  if(S.bijou)lignes.push(['Bijou de sac',"Suspendu à l'anse",'+ '+euros(460)]);
  if(S.grav) lignes.push(['Gravure',S.grav,'+ '+euros(180)]);

  lignes.forEach(function(l,i){
    var d=document.createElement('div');d.className='rec__r';
    d.innerHTML='<span class="rec__k">'+l[0]+'</span><span class="rec__v">'+l[1]+
      '<small>'+l[2]+'</small></span>';
    r.appendChild(d);
    setTimeout(function(){d.classList.add('in')}, RM?0:80+i*62);
  });
  var t=document.createElement('div');t.className='rec__tot';
  t.innerHTML='<span class="rec__tk">Estimation</span><span class="rec__tv">'+euros(total())+'</span>';
  r.appendChild(t);
  var n=document.createElement('p');n.className='rec__n';
  n.textContent='Montant ferme pour cette configuration. Un cuir exotique reste soumis à '+
    'disponibilité en tannerie — votre conseiller le confirme avant tout engagement. '+
    'Façonnage : 12 à 16 semaines.';
  r.appendChild(n);
  var c2=document.createElement('button');c2.className='rec__c';
  c2.textContent='Envoyer à mon conseiller';c2.addEventListener('click',envoyer);
  r.appendChild(c2);
}
function envoyer(){
  alert('Spécification transmise à votre conseiller.\n\n'+S.mdl.nom+' — '+euros(total())+
    '\n\nDémonstration : en production, elle part au conseiller qui établit le devis '+
    'et le lien de paiement.');
}

ambiance(null); majPrix(); animerMots();
})();
</script>
